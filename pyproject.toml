[project]
name = "limitful"
version = "0.1.0"
description = "Open-source replacement for the Limitless app: sync recordings over Bluetooth, transcribe them locally, then browse, search, summarise and ask about your days."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "faster-whisper>=1.1",
    # Imported directly to read added recordings (m4a, mp3, wav) and write them as Ogg Opus.
    "av>=12",
    "sherpa-onnx>=1.10",
    "numpy>=1.26",
    "anthropic>=2.8",
    "pyserial>=3.5",
    # Imported directly for search by meaning and the speech-model download.
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface-hub>=0.23",
    # The Model Context Protocol server (`limitful mcp`), so other apps can read the Lifelog.
    "mcp>=2",
    "pyrage>=1.4.0",
    # `limitful app`: Pillow draws the icon; pystray puts it in the Windows system tray.
    "pillow>=10",
    "pystray>=0.19; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/andreibondarev/limitful"

[project.scripts]
limitful = "limitful.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limitful"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
