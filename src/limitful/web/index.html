  const source = (r) => {
    const go = el("a", { href: `#${r.day}`, textContent: r.from });
    go.addEventListener("click", (e) => { e.preventDefault(); openDay(r.day, r.line?.id, r.conversation, true); });
    const box = el("div", { className: "from" }, icon("ask", 14), go);
    if (r.line) box.append(el("q", { textContent: r.line.text.length > 150 ? `${r.line.text.slice(0, 150)}…` : r.line.text }));
    return box;
  };

  // --- suggestions, grouped by the day they came up
  const suggested = all.filter((r) => r.status === "suggested");
  const inbox = el("section", { className: "inbox" },
    el("h2", {}, star(22), el("span", { textContent: "Suggested" }), el("small", { textContent: String(suggested.length) })),
    el("p", { className: "about", textContent: "Things someone said they would do, found in your conversations. Keep the ones that matter; the link plays the moment it came up." }));
  let lastDay = null;
  for (const r of suggested) {
    const when = new Date(r.line ? r.line.start : r.start);
    const key = dayKey(when);
    if (key !== lastDay) { lastDay = key; inbox.append(el("h3", { textContent: longDay.format(when) })); }
    const row = el("article", { className: "idea" });
    row.append(
      el("div", {}, el("p", { textContent: r.text }), source(r)),
      el("div", { className: "acts" },
        round("check", "Keep this reminder", () => set(r, "accepted", row), "yes"),
        round("x", "Dismiss this suggestion", () => set(r, "dismissed", row))));
    inbox.append(row);
  }
  if (!suggested.length) inbox.append(el("p", { className: "none", textContent: "Nothing to sort through. New suggestions appear as conversations are summarised." }));

  // --- your list: what you kept, then what you have finished
  const kept = all.filter((r) => r.status === "accepted"), done = all.filter((r) => r.status === "done");
  const list = el("section", { className: "mine" },
    el("h2", {}, icon("reminders", 22), el("span", { textContent: "To do" }), el("small", { textContent: String(kept.length) })));
  for (const r of kept) {
    const row = el("article", { className: "task" });
    row.append(
      round("check", "Mark as done", () => set(r, "done", row), "tick"),
      el("div", {}, el("p", { textContent: r.text }), source(r)),
      round("x", "Remove from your list", () => set(r, "dismissed", row), "faint"));
    list.append(row);
  }
  if (!kept.length) list.append(el("p", { className: "none", textContent: "Keep a suggestion and it lands here." }));
  if (done.length) {
    const finished = el("details", { className: "finished" }, el("summary", { textContent: `Done (${done.length})` }));
    for (const r of done) {
      const row = el("article", { className: "task was" });
      row.append(round("check", "Not done after all", () => set(r, "accepted", row), "tick ticked"), el("div", {}, el("p", { textContent: r.text })));
      finished.append(row);
    }
    list.append(finished);
  }
  main.replaceChildren(el("div", { className: "remind" }, inbox, list));
  countReminders();
}

/* Speakers are told apart by colour. A named person keeps theirs from day to day; a numbered
   speaker's only holds within its conversation, like the number itself. */
const WHO_COLOURS = 8;
const whoIndex = (speaker) => speaker.id !== null ? speaker.id % WHO_COLOURS
  : ((parseInt(speaker.name.replace(/\D/g, ""), 10) || 1) + 3) % WHO_COLOURS;
let dayTint = () => null;  // set for each day drawn, so a person keeps one colour all through it
function tinter() {
  const given = new Map(), taken = new Set();
  return (speaker) => {
    if (!speaker) return null;
    const key = speaker.id ?? speaker.name;
    if (!given.has(key)) {
      let i = whoIndex(speaker);
      for (let n = 0; n < WHO_COLOURS && taken.has(i); n++) i = (i + 1) % WHO_COLOURS;  // two people never share one
      taken.add(i);
      given.set(key, i);
    }
    return `var(--who-${given.get(key)})`;
  };
}

function whoRow(speaker, colour) {
  if (!speaker) return el("div", { className: "who unknown", textContent: "Not identified" });
  const linked = speaker.id !== null;  // false: an imported label not yet tied to a person
  const row = el("div", { className: "who" });
  if (colour) row.style.setProperty("--who", colour);
  const name = el("button", {}, el("i", { className: "dot" }), speaker.name);
  name.title = "Name this speaker";
  name.addEventListener("click", () => {
    const input = el("input", { value: linked ? speaker.name : "", placeholder: "Who is this?", maxLength: 80, ariaLabel: "Speaker name" });
    const here = el("button", { className: "here", textContent: "Only this conversation" });
    const plain = linked ? "Enter renames this person everywhere." : "Enter names this speaker in this conversation.";
    const hint = el("small", { textContent: plain });
    row.replaceChildren(input, ...(linked ? [here] : []), hint);
    input.focus(); input.select();
    // People already named are suggested while typing; anything else typed is a new person.
    let known = [];
    input.setAttribute("list", "people");
    $("people").replaceChildren();
    get("/api/people").then((all) => {
      if (!input.isConnected) return;
      const own = speaker.name.toLowerCase();
      const today = new Set(lines.filter((u) => u.speaker && u.speaker.id !== null).map((u) => u.speaker.name));
      known = all.map((p) => p.name).filter((n) => n.toLowerCase() !== own);
      known.sort((a, b) => today.has(b) - today.has(a));  // those heard this day first; otherwise most recent first
      $("people").replaceChildren(...known.map((n) => el("option", { value: n })));
    }).catch(() => { /* no suggestions; the field still takes any name */ });
    input.addEventListener("input", () => {
      const typed = input.value.trim().toLowerCase();
      const same = known.find((n) => n.toLowerCase() === typed);
      hint.textContent = same ? `Same person as ${same}. ${linked ? "Enter merges the two everywhere." : plain}`
        : typed && !linked ? `New person. ${plain}` : plain;
    });
    let busy = false;
    const cancel = () => { if (!busy) row.replaceChildren(name); };
    const save = async (everywhere) => {
      const value = input.value.trim();
      if (!value || (everywhere && value === speaker.name)) { cancel(); return; }
      busy = true;
      try {
        await post(everywhere ? `/api/speakers/${speaker.id}` : `/api/lines/${speaker.line}/speaker`, { name: value });
        lines = await get(`/api/day/${day}`);
        renderDay();
      } catch (err) {
        busy = false;
        hint.textContent = `Could not save. ${sentence(err.message)}`;
      }
    };
    // Leaving the field cancels, unless the click went to the button beside it.
    input.addEventListener("blur", (e) => { if (e.relatedTarget !== here) cancel(); });
    here.addEventListener("mousedown", (e) => e.preventDefault());  // Safari does not focus a clicked button
    input.addEventListener("keydown", (e) => {
      if (e.key === "Escape") cancel();
      else if (e.key === "Enter") save(linked);
    });
    here.addEventListener("click", () => save(false));
  });
  row.append(name);
  return row;
}

/* The day's recap sits above its conversations: what the day was about, then its threads. */
async function showRecap(box, forDay) {
  let state;
  try { state = await get(`/api/recap/${forDay}`); } catch { return; }
  if (forDay !== day || !box.isConnected) return;  // moved on while it loaded
  const write = (label) => {
    const b = el("button", { className: "pill" }, ...withIcon("summary", label, 16));
    b.addEventListener("click", async () => {
      b.disabled = true;
      b.lastChild.textContent = "Writing…";
      try { state = await post(`/api/recap/${forDay}`, {}); draw(); }
      catch (err) { b.disabled = false; b.lastChild.textContent = label; box.append(el("p", { className: "oops", textContent: err.message })); }
    });
    return b;
  };
  const draw = () => {
    const r = state.recap;
    box.hidden = !r && !state.can_write;
    box.classList.toggle("bare", !r);
    if (!r) { box.replaceChildren(write("Write a recap of this day")); return; }
    box.replaceChildren(
      el("p", { className: "headline", textContent: r.headline }),
      el("ul", {}, ...r.points.map((point) => el("li", { textContent: point }))));
    if (r.stale && state.can_write) box.append(el("p", { className: "stale" }, "This day has changed since the recap was written. ", write("Write it again")));
  };
  draw();
}

/* The header's height changes (notices, the day strip), and the side column sticks just under it. */
new ResizeObserver(([entry]) => {
  document.documentElement.style.setProperty("--head", `${Math.round(entry.target.offsetHeight)}px`);
}).observe(document.querySelector("header"));

/* The calendar: a month at a time, each day shaded by how much was said, with the day's
   recap shown as you point at it. */
const shortDay = new Intl.DateTimeFormat([], { day: "numeric", month: "short", year: "numeric" });
const monthName = new Intl.DateTimeFormat([], { month: "long", year: "numeric" });
const weekdayName = new Intl.DateTimeFormat([], { weekday: "narrow" });
let calendarMonth = null;  // first day of the month on show
// The date control names the day on show: weekday first, the year only when it is not this one.
const pickDay = new Intl.DateTimeFormat([], { weekday: "short", day: "numeric", month: "short" });
const pickDayYear = new Intl.DateTimeFormat([], { weekday: "short", day: "numeric", month: "short", year: "numeric" });
function showPicked() {
  const date = day ? new Date(dayStart(day)) : null;
  $("pick").textContent = !date ? "Calendar" : (date.getFullYear() === new Date().getFullYear() ? pickDay : pickDayYear).format(date);
  $("pick").setAttribute("aria-label", date ? `${longDay.format(date)}. Open the calendar` : "Open the calendar");
}
function closeCalendar() {
  $("calendar").hidden = true;
  $("pick").setAttribute("aria-expanded", "false");
}
function openCalendar() {
  const at = new Date(dayStart(day || dayKey(new Date())));
  calendarMonth = new Date(at.getFullYear(), at.getMonth(), 1);
  drawCalendar();
  $("calendar").hidden = false;
  $("pick").setAttribute("aria-expanded", "true");
  ($("calendar").querySelector(".picked") || $("calendar").querySelector("button"))?.focus();
}
function drawCalendar() {
  const known = new Map(days.map((d) => [d.day, d]));
  // Shade against a busy day, not the single busiest, so one marathon does not flatten the rest.
  const sizes = days.map((d) => d.lines).sort((a, b) => a - b);
  const busy = sizes.length ? Math.max(1, sizes[Math.floor(0.9 * (sizes.length - 1))]) : 1;
  const year = calendarMonth.getFullYear(), month = calendarMonth.getMonth();
  let firstDay = 7;  // Sunday, unless the reader's locale says otherwise
  try { firstDay = new Intl.Locale(navigator.language).weekInfo?.firstDay ?? 7; } catch { /* keep Sunday */ }
  const lead = (new Date(year, month, 1).getDay() - (firstDay % 7) + 7) % 7;
  const count = new Date(year, month + 1, 0).getDate();
  const today = dayKey(new Date());

  const detail = el("div", { className: "detail" });
  const describe = (key) => {
    const d = known.get(key), date = new Date(dayStart(key));
    const head = el("b", { textContent: longDay.format(date) });
    if (!d) { detail.replaceChildren(head, el("p", { textContent: "Nothing recorded." })); return; }
    const what = d.talks ? `${d.talks} conversation${d.talks === 1 ? "" : "s"}` : `${d.lines} line${d.lines === 1 ? "" : "s"}`;
    detail.replaceChildren(head, el("small", { textContent: what }),
      el("p", { className: d.headline ? "said" : "", textContent: d.headline || "No recap written for this day." }));
  };
  const idle = () => {
    if (day && new Date(dayStart(day)).getFullYear() === year && new Date(dayStart(day)).getMonth() === month) describe(day);
    else detail.replaceChildren(el("p", { textContent: "Point at a day to see what it was about." }));
  };

  const grid = el("div", { className: "month" });
  for (let n = 0; n < 7; n++) grid.append(el("span", { className: "dow", textContent: weekdayName.format(new Date(2023, 0, 1 + ((firstDay % 7) + n) % 7)) }));
  for (let n = 0; n < lead; n++) grid.append(el("span"));
  for (let n = 1; n <= count; n++) {
    const key = `${year}-${pad(month + 1)}-${pad(n)}`, d = known.get(key);
    const level = d ? Math.max(1, Math.min(4, Math.ceil(4 * d.lines / busy))) : 0;
    const cell = el("button", { textContent: String(n), className: `l${level}${key === day ? " picked" : ""}${key === today ? " today" : ""}`, disabled: !d });
    cell.setAttribute("aria-label", `${longDay.format(new Date(year, month, n))}${d ? `, ${d.lines} line${d.lines === 1 ? "" : "s"}` : ", nothing recorded"}`);
    if (d) {
      cell.addEventListener("click", () => { closeCalendar(); openDay(key); });
      cell.addEventListener("mouseenter", () => describe(key));
      cell.addEventListener("focus", () => describe(key));
    }
    grid.append(cell);
  }
  grid.addEventListener("mouseleave", idle);

  const turn = (by, label, text) => {
    const b = el("button", { className: "step", textContent: text, ariaLabel: label });
    b.addEventListener("click", (e) => { e.stopPropagation(); calendarMonth = new Date(year, month + by, 1); drawCalendar();
      // The calendar was drawn again, so the arrow just pressed is gone: hand focus to its replacement.
      [...$("calendar").querySelectorAll(".step")].find((n) => n.getAttribute("aria-label") === label)?.focus();
    });
    return b;
  };
  const months = days.map((d) => d.day.slice(0, 7));
  const here = `${year}-${pad(month + 1)}`;
  const earlier = turn(-1, "Previous month", "‹"), later = turn(1, "Next month", "›");
  earlier.disabled = !months.some((m) => m < here);
  later.disabled = !months.some((m) => m > here);
  $("calendar").replaceChildren(
    el("div", { className: "top" }, earlier, el("b", { textContent: monthName.format(calendarMonth) }), later),
    grid,
    el("div", { className: "key", ariaHidden: "true" }, "less", ...[1, 2, 3, 4].map((l) => el("i", { className: `l${l}` })), "more said"),
    detail);
  idle();
}

/* A run of stray moments, folded into one row that opens to show them. */
function scraps(run) {
  const cards = run.map((g) => card(g));
  const first = clock.format(new Date(run[0].start)), last = clock.format(new Date(run[run.length - 1].start));
  const said = run.map((g) => g.own.map((u) => u.text).join(" ")).join(" · ");
  const key = `s${run[0].key}`;
  const all = picking ? el("input", { type: "checkbox", className: "pick", ariaLabel: `Select ${run.length === 1 ? "this short moment" : `these ${run.length} short moments`}` }) : null;
  if (all) {
    const show = () => {
      const ticked = run.filter((g) => picking.keys.has(g.key)).length;
      all.checked = ticked === run.length;
      all.indeterminate = ticked > 0 && ticked < run.length;
    };
    all.addEventListener("change", () => {
      for (const g of run) { if (all.checked) picking.keys.add(g.key); else picking.keys.delete(g.key); }
      tickChanged();
    });
    picking.watch.push(show);
    show();
  }
  const box = el("details", { className: "scraps" },
    el("summary", {},
      el("span", {}, ...(all ? [all] : [])),
      el("span", {},
        el("b", { textContent: `${run.length} short moment${run.length === 1 ? "" : "s"}` }),
        ` ${run.length === 1 || first === last ? first : `${first} to ${last}`}`,
        el("small", { textContent: said.length > 90 ? `${said.slice(0, 90)}…` : said }))),
    ...cards);
  box.addEventListener("toggle", () => { if (box.open) openCards.add(key); else openCards.delete(key); });
  if (openCards.has(key)) box.open = true;
  // Opening one of its moments (to show a search hit, say) opens the fold too.
  for (const g of run) {
    const inner = g.setOpen;
    g.setOpen = (open) => { if (open) box.open = true; inner(open); };
  }
  return box;
}

/* Beside the conversations: what from this day is still to be done. */
function followUps() {
  const open = groups.flatMap((g) => g.reminders
    .filter((r) => r.status === "suggested" || r.status === "accepted").map((r) => ({ r, g })));
  if (!open.length) return [];
  const list = el("ul", { className: "plain" });
  for (const { r, g } of open) {
    const said = r.line && g.own.some((u) => u.id === r.line);
    const go = el("button", { className: "go", title: said ? "Show where this was said" : "Open the conversation" },
      el("span", { textContent: r.text }),
      el("small", { textContent: `${clock.format(new Date(g.start))}${r.status === "suggested" ? ", suggested" : ""}` }));
    go.addEventListener("click", () => {
      if (said) reveal(r.line, true);
      else { g.setOpen(true); $(`g${g.key}`).scrollIntoView({ block: "start" }); }
    });
    let jump = null;
    if (said) {
      jump = el("button", { className: "jump", textContent: "Play the line" });
      jump.addEventListener("click", () => {
        reveal(r.line, true);
        const from = lines.find((u) => u.id === r.line);
        if (from) play(from);
      });
    }
    list.append(el("li", {}, go, reminderActs(r, () => { renderDay(); countReminders(); }, jump)));
  }
  return [el("section", {}, el("h3", { textContent: "Reminders" }), list)];
}

/* Beside the conversations: the named people heard this day, by how long they spoke. */
function people() {
  const heard = new Map();
  for (const g of groups) {
    for (const u of g.own) {
      if (!u.speaker || u.speaker.id === null) continue;
      const p = heard.get(u.speaker.id) || { speaker: u.speaker, ms: 0, first: g };
      p.ms += Math.max(0, u.end - u.start);
      heard.set(u.speaker.id, p);
    }
  }
  if (!heard.size) return [];
  const list = el("ul", { className: "plain" });
  for (const p of [...heard.values()].sort((a, b) => b.ms - a.ms)) {
    const go = el("button", { className: "go", title: `Open the first conversation with ${p.speaker.name}` },
      el("span", {}, el("i", { className: "dot" }), p.speaker.name),
      el("small", { textContent: p.ms < 60000 ? "under a minute" : `${lengthOf(p.ms)} speaking` }));
    go.style.setProperty("--who", dayTint(p.speaker));
    go.addEventListener("click", () => { p.first.setOpen(true); $(`g${p.first.key}`).scrollIntoView({ block: "start" }); });
    list.append(el("li", {}, go));
  }
  return [el("section", {}, el("h3", { textContent: "People" }), list)];
}

/* From when to when a conversation's lines run, as the server deletes it. */
const spanOf = (g) => { const last = g.own[g.own.length - 1]; return [g.start, Math.max(g.end, last ? last.start : g.end)]; };

/* After deleting: stop what was playing if it went, and show the day as it now is.
   False if the reader has moved to another day meanwhile. */
async function showWithout(gone) {
  if (playing && gone.some((g) => g.own.some((u) => u.id === playing.id))) { $("audio")?.pause?.(); playing = null; track = null; }
  gone.forEach((g) => openCards.delete(g.key));
  const at = day;
  days = await get("/api/days");
  [lines, talks] = await Promise.all([get(`/api/day/${at}`), get(`/api/conversations/${at}`)]);
  if (!onDay(at)) return false;
  renderDay();
  countReminders();
  return true;
}

/* The row above a day's conversations: how many there are and "Open all"; or, after "Select",
   how many are ticked and "Delete…" for those. Deleting asks first, in place, as it does for one. */
function pickTools(count, toggleAll, stray) {
  const row = el("div", { className: "tools" });
  const make = (text, className, act) => { const b = el("button", { className, textContent: text }); b.addEventListener("click", act); return b; };
  if (!picking) {
    row.append(el("span", { textContent: count }), toggleAll,
      make("Select", "copy", () => { picking = { day, keys: new Set(), watch: [], trouble: "" }; renderDay(); }));
    return row;
  }
  const chosen = () => groups.filter((g) => picking.keys.has(g.key));
  const draw = () => {
    const n = picking.keys.size;
    const remove = make("Delete…", "copy away", ask);
    remove.disabled = !n;
    row.replaceChildren(
      el("span", { textContent: n ? `${n} selected` : "Tick what to delete" }),
      n < groups.length
        ? make("Select all", "copy", () => { groups.forEach((g) => picking.keys.add(g.key)); tickChanged(); })
        : make("Select none", "copy", () => { picking.keys.clear(); tickChanged(); }),
      remove,
      make("Done", "copy", () => { picking = null; renderDay(); }),
      ...(picking.trouble ? [el("span", { className: "asking failed", role: "alert", textContent: picking.trouble })] : []));
  };
  function ask() {
    const going = chosen();
    const moments = going.filter(stray).length, real = going.length - moments;
    const what = [real && `${real} conversation${real === 1 ? "" : "s"}`, moments && `${moments} short moment${moments === 1 ? "" : "s"}`].filter(Boolean).join(" and ");
    const sure = make("Delete for good", "copy danger", async () => {
      sure.disabled = no.disabled = true;
      sure.textContent = "Deleting…";
      try {
        await post("/api/forget", { spans: going.map(spanOf) });
      } catch (err) {
        // Some may have gone before it stopped: show the day as it now is, still choosing.
        picking.trouble = `Could not delete. ${sentence(err.message)}`;
        try { await showWithout([]); } catch { draw(); }
        return;
      }
      picking = null;
      if (await showWithout(going)) sayDone(`Deleted ${what}.`);
    });
    const no = make("Cancel", "copy", draw);
    row.replaceChildren(
      el("span", { className: "asking", textContent: `Delete ${what}? ${going.length === 1 ? "Its" : "Their"} audio, lines, notes and reminders go, and cannot be brought back.` }),
      sure, no);
    no.focus();
  }
  picking.watch.push(draw);
  draw();
  return row;
}

function renderDay() {
  // The date is in the control beside it.
  $("title").textContent = "Lifelog";
  document.title = `Lifelog, ${day}`;
  showPicked();
  const known = days.map((d) => d.day);
  $("prev").disabled = !known.some((d) => d < day);
  $("next").disabled = !known.some((d) => d > day);

  if (!lines.length) {
    groups = [];
    drawStrip();
    main.replaceChildren(el("div", { className: "empty" },
      el("p", { textContent: "Nothing was said on this day, or nothing has been synced yet." }),
      ...(days.length ? [el("p", {}, "To bring in new audio from the pendant, run ", el("code", { textContent: "uv run limitful watch" }), ", or use Sync now under Settings.")]
        : [(() => { const b = el("button", { className: "pill main", textContent: "Set up Limitful" }); b.addEventListener("click", () => showWelcome()); return b; })()])));
    return;
  }
  groups = buildGroups();
  if (picking && picking.day !== day) picking = null;  // choosing is for one day; leaving it ends it
  if (picking) {
    picking.watch = [];
    picking.keys = new Set(groups.filter((g) => picking.keys.has(g.key)).map((g) => g.key));
  }
  dayTint = tinter();
  const peopleList = people();  // first, so whoever spoke most gets first pick of colour
  drawStrip();
  const toggleAll = el("button", { id: "all", textContent: "Open all" });
  toggleAll.addEventListener("click", () => {
    const open = toggleAll.textContent === "Open all";
    groups.forEach((g) => g.setOpen(open));
    document.querySelectorAll(".scraps").forEach((box) => { box.open = open; });
    toggleAll.textContent = open ? "Close all" : "Open all";
  });
  // A few stray words with no title are not a conversation: fold runs of them into one quiet row,
  // unless they are all the day has.
  const stray = (g) => !g.title && g.own.length <= 3 && g.own.reduce((n, u) => n + u.text.split(/\s+/).length, 0) < 25;
  const fold = groups.some((g) => !stray(g));
  const longest = Math.max(1, ...groups.map((g) => g.end - g.start));
  const rows = [];
  let run = [], strays = 0;
  // A long day gets landmarks: a quiet heading where the morning, afternoon or evening begins.
  const partOf = (ms) => { const h = new Date(ms).getHours(); return h < 5 ? "Night" : h < 12 ? "Morning" : h < 17 ? "Afternoon" : "Evening"; };
  const parts = new Set(groups.map((g) => partOf(g.start))).size > 1;
  let part = null;
  const landmark = (ms) => {
    if (parts && partOf(ms) !== part) { part = partOf(ms); rows.push(el("h3", { className: "part" }, ...withIcon(PART_ICONS[part], part, 15))); }
  };
  const flush = () => { if (run.length) { landmark(run[0].start); rows.push(scraps(run)); strays += run.length; run = []; } };
  for (const g of groups) {
    if (fold && stray(g)) {
      if (run.length && partOf(g.start) !== partOf(run[0].start)) flush();  // a fold does not straddle two parts
      run.push(g);
    } else { flush(); landmark(g.start); rows.push(card(g, longest)); }
  }
  flush();
  const real = groups.length - strays;
  const count = `${real} conversation${real === 1 ? "" : "s"}${strays ? `, ${strays} short moment${strays === 1 ? "" : "s"}` : ""}`;
  const recap = el("section", { className: "recap", hidden: true });
  const talk = el("section", { className: "recap talk", hidden: true });
  const side = [talk, recap, ...followUps(), ...peopleList];
  const glance = el("aside", { className: "glance", ariaLabel: "This day at a glance" }, ...side);
  const grid = el("div", { className: "daygrid" },
    el("div", { className: picking ? "talks picking" : "talks" }, pickTools(count, toggleAll, (g) => fold && stray(g)), ...rows),
    glance);
  main.replaceChildren(grid);
  // With nothing to put beside them, the conversations take the full width.
  const solo = () => grid.classList.toggle("solo", recap.hidden && side.length === 2 && !groups.some(hasBrief));
  solo();
  // The summary of the open conversation being read, in the recap's place; the day's recap
  // comes back when none is open or in view.
  let shown = null;
  refreshTalk = () => {
    if (!grid.isConnected) return;
    const line = document.querySelector("header").getBoundingClientRect().bottom + 48;
    let reading = null, below = null;
    for (const g of groups) {
      if (!openCards.has(g.key) || !hasBrief(g) || viewOf(g) !== "transcript") continue;  // in Notes it is already in the card
      const at = $(`g${g.key}`)?.getBoundingClientRect();
      if (!at) continue;
      if (at.top <= line && at.bottom > line) { reading = g; break; }
      if (!below && at.top > line && at.top < innerHeight) below = g;
    }
    const now = reading || below;
    if (now === shown) return;
    shown = now;
    talk.hidden = !now;
    glance.classList.toggle("talking", Boolean(now));
    if (now) talk.replaceChildren(
      el("p", { className: "kicker", textContent: `Conversation at ${clock.format(new Date(now.start))}` }),
      el("p", { className: "headline", textContent: now.title || "Untitled conversation" }),
      el("ul", {}, ...now.summary.map((t) => el("li", { textContent: t }))));
  };
  showRecap(recap, day).then(solo);
  if (groups.length === 1) groups[0].setOpen(true);
  refreshTalk();
  markPlaying();
  if (wanted) {
    const { line, talk, start } = wanted;
    wanted = null;
    document.querySelectorAll(".found").forEach((n) => n.classList.remove("found"));
    let from = null;  // the line to start playing at, when asked to
    if (line && groups.some((g) => g.own.some((u) => u.id === line))) {
      reveal(line, true);
      from = lines.find((u) => u.id === line);
    } else if (talk) {
      const g = groups.find((x) => x.key === `c${talk}`);
      if (g) {
        g.setOpen(true);
        $(`g${g.key}`).scrollIntoView({ block: "start" });
        from = g.own.find((u) => u.audio);
      }
    }
    if (start && from) play(from);
  }
}

/* The strip under the header: bars for how much was said in each five minutes, a line under
   each conversation, hour marks, and a playhead. It zooms to the part of the day with speech. */
const HOUR_MS = 3600000, BUCKET_MS = 300000;
const hourLabel = new Intl.DateTimeFormat([], { hour: "numeric" });
let span = { from: 0, to: 1 };  // the stretch of time the strip covers
const along = (ms) => `${((ms - span.from) / (span.to - span.from)) * 100}%`;

function drawStrip() {
  const midnight = dayStart(day);
  let from = midnight + 8 * HOUR_MS, to = midnight + 20 * HOUR_MS;
  if (lines.length) {
    from = Math.floor(lines[0].start / HOUR_MS) * HOUR_MS;
    to = Math.ceil(lines.reduce((m, u) => Math.max(m, u.end), 0) / HOUR_MS) * HOUR_MS;
    // Keep at least six hours in view so a short day does not become one fat bar.
    for (let grow = 0; to - from < 6 * HOUR_MS && grow < 12; grow++) { if (grow % 2) from -= HOUR_MS; else to += HOUR_MS; }
  }
  span = { from, to };

  const count = Math.round((to - from) / BUCKET_MS);
  const spoken = new Array(count).fill(0);
  for (const u of lines) {
    const end = Math.min(Math.max(u.end, u.start + 1000), to);
    for (let b = Math.max(0, Math.floor((u.start - from) / BUCKET_MS)); b < count && from + b * BUCKET_MS < end; b++) {
      spoken[b] += Math.min(end, from + (b + 1) * BUCKET_MS) - Math.max(u.start, from + b * BUCKET_MS);
    }
  }
  const step = (to - from) <= 8 * HOUR_MS ? 1 : (to - from) <= 16 * HOUR_MS ? 2 : 3;
  const marks = [];
  for (let t = from; t <= to; t += step * HOUR_MS) marks.push(t);

  const nodes = marks.slice(1, -1).map((t) => { const n = el("s", { className: "tick" }); n.style.left = along(t); return n; });
  spoken.forEach((ms, b) => {
    if (!ms) return;
    const bar = el("i", { className: "bar" });
    bar.dataset.at = from + b * BUCKET_MS;
    bar.style.left = `calc(${(b / count) * 100}% + 0.5px)`;
    bar.style.width = `calc(${100 / count}% - 1px)`;
    // Square root, so a few words in five minutes still shows.
    bar.style.height = `calc((100% - 8px) * ${0.12 + 0.88 * Math.sqrt(Math.min(1, ms / BUCKET_MS))})`;
    nodes.push(bar);
  });
  for (const g of groups) {
    const line = el("b", { className: g.title ? "talk" : "talk loose" });
    line.dataset.key = g.key;
    line.style.left = along(g.start);
    line.style.width = `${((Math.max(g.end, g.start + 60000) - g.start) / (to - from)) * 100}%`;
    nodes.push(line);
  }
  // A pin where each open reminder came up.
  for (const g of groups) {
    for (const r of g.reminders) {
      if (r.status !== "suggested" && r.status !== "accepted") continue;
      const said = r.line ? g.own.find((u) => u.id === r.line) : null;
      const pin = el("button", { className: "pin", title: r.text, ariaLabel: `Reminder: ${r.text}` });
      pin.style.left = along(said ? said.start : g.start);
      pin.addEventListener("click", (e) => {
        e.stopPropagation();
        if (said) reveal(said.id, true); else { g.setOpen(true); $(`g${g.key}`).scrollIntoView({ block: "start" }); }
      });
      pin.addEventListener("mousemove", (e) => e.stopPropagation());
      pin.addEventListener("mouseenter", () => { lightUp(g); if ($("tip")) $("tip").hidden = true; });
      nodes.push(pin);
    }
  }
  nodes.push(el("u", { id: "head", hidden: true }), el("div", { id: "tip", hidden: true }));
  strip.replaceChildren(...nodes);

  $("hours").replaceChildren(...marks.map((t, i) => {
    const label = el("span", { textContent: hourLabel.format(new Date(t)) });
    label.style.left = along(t);
    label.style.transform = i === 0 ? "none" : i === marks.length - 1 ? "translateX(-100%)" : "translateX(-50%)";
    return label;
  }));
}

/* Light one conversation up, on the strip and in the list, and dim the rest of the strip.
   Pointing at either one shows where it is on the other. */
function lightUp(g) {
  strip.classList.toggle("over", Boolean(g));
  document.querySelectorAll(".hot").forEach((n) => n.classList.remove("hot"));
  if (!g) return;
  strip.querySelectorAll(".bar").forEach((bar) => {
    const t = Number(bar.dataset.at);
    if (t + BUCKET_MS > g.start && t <= g.end) bar.classList.add("hot");
  });
  strip.querySelector(`.talk[data-key="${g.key}"]`)?.classList.add("hot");
  $(`g${g.key}`)?.classList.add("hot");
}

/* Hovering the strip names the conversation under the pointer and lights up its bars. */
function groupAt(ms) { return groups.find((g) => ms >= g.start && ms <= Math.max(g.end, g.start + 60000)); }
strip.addEventListener("mousemove", (e) => {
  const tip = $("tip");
  if (!tip || !lines.length) return;
  const box = strip.getBoundingClientRect();
  const x = Math.min(Math.max(0, e.clientX - box.left), box.width);
  const at = span.from + (x / box.width) * (span.to - span.from);
  const g = groupAt(at);
  lightUp(g);
  const first = g ? g.own[0].text : "";
  const name = g ? (g.title || (first.length > 60 ? `${first.slice(0, 60)}…` : first)) : "quiet";
  tip.replaceChildren(el("b", { textContent: clock.format(new Date(g ? g.start : at)) }), name);
  tip.hidden = false;
  tip.style.left = `${Math.min(Math.max(x, 90), box.width - 90)}px`;
});
strip.addEventListener("mouseleave", () => {
  lightUp(null);
  if ($("tip")) $("tip").hidden = true;
});

/* The day's conversations: summarised ones, plus runs of lines that have no summary. */
function buildGroups() {
  const out = [], taken = new Set();
  for (const t of talks) {
    const own = lines.filter((u) => u.start >= t.start && u.start <= t.end);
    if (!own.length) continue;
    own.forEach((u) => taken.add(u.id));
    out.push({ ...t, key: `c${t.id}`, own });
  }
  let run = null;
  for (const u of lines) {
    if (taken.has(u.id)) { run = null; continue; }
    if (!run || u.start - run.end > TALK_GAP_MS) {
      run = { key: `l${u.start}`, start: u.start, end: u.end, title: null, summary: [], sections: [], reminders: [], own: [] };
      out.push(run);
    }
    run.own.push(u);
    run.end = Math.max(run.end, u.end);
  }
  return out.sort((x, y) => x.start - y.start);
}

function lengthOf(ms) {
  const min = Math.round(ms / 60000);
  if (min < 1) return "under a minute";
  if (min < 60) return `${min} min`;
  return `${Math.floor(min / 60)} h${min % 60 ? ` ${min % 60} min` : ""}`;
}

/* A conversation, closed until clicked. The bar under its time shows how long it ran,
   against the day's longest. */
const PART_ICONS = { Morning: "morning", Afternoon: "bright", Evening: "evening", Night: "night" };
/* A conversation with a summary of its own to show. */
const hasBrief = (g) => !g.sections.length && g.summary.length > 0;
/* An open conversation shows its Notes (what it came to, what it covered) or its Transcript.
   The side last chosen is where the next one opens; one sent to a line shows its transcript. */
// An imported conversation's "summary" is only its topic headings over again; those go in the outline.
const pointsOf = (g) => g.summary.filter((t) => !g.sections.some((heading) => heading.title === t));
const hasNotes = (g) => (g.notes || []).length > 0 || pointsOf(g).length > 0 || g.sections.length > 0;
let viewWanted = "notes";
try { if (localStorage.getItem("limitful-view") === "transcript") viewWanted = "transcript"; } catch { /* notes first */ }
const viewChosen = new Map();  // conversation key -> the side it was last put on, while the page is open
const viewOf = (g) => hasNotes(g) ? (viewChosen.get(g.key) || viewWanted) : "transcript";
let refreshTalk = () => {};  // set by the day view: shows the summary of the conversation being read
let talkTick = 0;
window.addEventListener("scroll", () => {
  if (!talkTick) talkTick = requestAnimationFrame(() => { talkTick = 0; refreshTalk(); });
}, { passive: true });

function card(g, longest = 0) {
  const first = g.own[0].text;
  const title = g.title || (first.length > 70 ? `${first.slice(0, 70)}…` : first);
  const waiting = g.reminders.filter((r) => r.status === "suggested").length;
  const meta = [lengthOf(g.end - g.start), `${g.own.length} line${g.own.length === 1 ? "" : "s"}`];
  if (waiting) meta.push(`${waiting} suggested reminder${waiting === 1 ? "" : "s"}`);
  const body = el("div", { className: "body" });
  const length = el("i", { className: "len", hidden: !longest, title: lengthOf(g.end - g.start) });
  if (longest) length.style.width = `${Math.max(6, 100 * (g.end - g.start) / longest)}%`;
  const heading = el("h2", { textContent: title, className: g.title ? "" : "untitled" });
  const about = el("p", { className: "meta", textContent: meta.join(", ") });
  if (g.id) heading.append(renameButton(g, heading, about));  // runs of lines with no summary have nothing to rename
  const box = el("details", { className: "card", id: `g${g.key}` },
    el("summary", {},
      el("div", { className: "when" }, el("time", { textContent: clock.format(new Date(g.start)) }), length),
      el("div", {}, heading, about)),
    body);
  if (picking) {
    const tick = el("input", { type: "checkbox", className: "pick", ariaLabel: `Select ${g.title ? `“${g.title}”` : `the lines at ${clock.format(new Date(g.start))}`}` });
    tick.addEventListener("change", () => {
      if (tick.checked) picking.keys.add(g.key); else picking.keys.delete(g.key);
      tickChanged();
    });
    picking.watch.push(() => { tick.checked = picking.keys.has(g.key); });
    tick.checked = picking.keys.has(g.key);
    box.firstChild.firstChild.prepend(tick);
  }
  // The transcript is only built when the card is first opened: days can hold thousands of lines.
  const fill = () => { if (!body.childElementCount) { body.append(...cardBody(g)); markPlaying(); } };
  box.addEventListener("toggle", () => {
    if (box.open) { openCards.add(g.key); fill(); } else openCards.delete(g.key);
    refreshTalk();
  });
  g.setOpen = (open) => { if (open) { openCards.add(g.key); fill(); } else openCards.delete(g.key); box.open = open; refreshTalk(); };
  if (openCards.has(g.key)) g.setOpen(true);
  box.addEventListener("mouseenter", () => lightUp(g));
  box.addEventListener("mouseleave", () => lightUp(null));
  box.firstChild.addEventListener("focus", () => lightUp(g));
  box.firstChild.addEventListener("blur", () => lightUp(null));
  return box;
}

/* The pencil beside an open conversation's title. It turns the title into a field: Enter keeps
   what was typed, Escape or clicking away leaves the title as it was. */
function renameButton(g, heading, about) {
  const button = el("button", { className: "rename", title: "Rename this conversation", ariaLabel: "Rename this conversation" }, icon("rename", 16));
  button.addEventListener("click", (e) => {
    e.preventDefault(); e.stopPropagation();  // the title sits in the part that opens and closes the card
    const input = el("input", { className: "retitle", value: g.title || "", maxLength: 200, ariaLabel: "Conversation title" });
    const was = about.textContent;
    let busy = false;
    const cancel = () => { if (!busy && input.isConnected) { input.replaceWith(heading); about.textContent = was; } };
    const save = async () => {
      const value = input.value.trim().replace(/\s+/g, " ");
      if (!value || value === g.title) { cancel(); return; }
      busy = true;
      try {
        await post(`/api/conversations/${g.id}`, { title: value });
        talks = await get(`/api/conversations/${day}`);
        renderDay();
      } catch (err) {
        busy = false;
        about.textContent = `Could not rename. ${sentence(err.message)}`;
      }
    };
    heading.replaceWith(input);
    about.textContent = "Enter to rename, Esc to leave it as it was.";
    input.focus(); input.select();
    input.addEventListener("click", (e) => e.preventDefault());  // typing here must not close the card
    input.addEventListener("keyup", (e) => { if (e.key === " ") e.preventDefault(); });  // Firefox toggles on Space
    input.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Escape") cancel();
      else if (e.key === "Enter") { e.preventDefault(); save(); }
    });
    input.addEventListener("blur", cancel);
  });
  return button;
}

/* One thing somebody said, set inline so a speaker's turn reads as a paragraph. Click to play. */
function saying(u) {
  const node = el("span", { className: "say", id: `u${u.id}`, textContent: u.text, title: clockSec.format(new Date(u.start)) });
  if (!u.audio) { node.classList.add("mute"); return node; }
  node.tabIndex = 0;
  node.setAttribute("role", "button");
  node.addEventListener("click", () => play(u));
  node.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); play(u); } });
  return node;
}

const TURN_PAUSE_MS = 3000, TURN_CHARS = 480;  // a pause, or this much text, starts a new paragraph

/* "Delete…" on an open conversation. It asks first, in place, saying what goes: this cannot
   be undone, and the audio goes with the words. */
function deleteButton(g) {
  const button = el("button", { className: "copy away", textContent: "Delete…" });
  button.addEventListener("click", () => {
    const bar = button.parentElement, was = [...bar.childNodes];
    const sure = el("button", { className: "copy danger", textContent: "Delete for good" });
    const no = el("button", { className: "copy", textContent: "Cancel" });
    const what = g.id ? "this conversation" : "these lines";
    const ask = el("span", { className: "asking", textContent: `Delete ${what}? Its audio, lines, notes and reminders go, and cannot be brought back.` });
    bar.replaceChildren(ask, sure, no);
    no.addEventListener("click", () => bar.replaceChildren(...was));
    no.focus();
    sure.addEventListener("click", async () => {
      sure.disabled = no.disabled = true;
      sure.textContent = "Deleting…";
      try {
        const [start_ms, end_ms] = spanOf(g);
        await post("/api/forget", { start_ms, end_ms });
        if (await showWithout([g])) sayDone(g.id ? "Conversation deleted." : "Lines deleted.");
      } catch (err) {
        ask.textContent = `Could not delete. ${sentence(err.message)}`;
        sure.remove();
        no.disabled = false;
        no.textContent = "Close";
      }
    });
  });
  return button;
}

function cardBody(g) {
  const nodes = [];  // the transcript
  const marks = [];  // its headings, in order, for the outline in Notes to jump to
  const copy = el("button", { className: "copy", textContent: "Copy as Markdown" });
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(asMarkdown(g)); copy.textContent = "Copied"; }
    catch { copy.textContent = "Could not copy"; }
    setTimeout(() => { copy.textContent = "Copy as Markdown"; }, 2000);
  });

  const labelled = g.own.some((u) => u.speaker);
  const tint = dayTint;
  const who = (x) => x.speaker ? (x.speaker.id ?? x.speaker.name) : 0;
  const headings = [...g.sections];
  let turn = null, chars = 0, lastTimed = null;
  g.own.forEach((u, n) => {
    const before = g.own[n - 1];
    let fresh = !before;
    while (headings.length && headings[0].start <= u.start) {
      const heading = headings.shift();
      const mark = el(heading.level === 2 ? "h3" : "h4", { textContent: heading.title });
      marks.push(mark);
      nodes.push(mark);
      fresh = true;
    }
    const gap = before && u.start - before.end > QUIET_MS;
    if (gap) nodes.push(el("div", { className: "quiet", textContent: quietFor(u.start - before.end) }));
    const changed = fresh || gap || who(before) !== who(u);
    const colour = tint(u.speaker);
    // Say who is speaking whenever it changes, and at the top of each section.
    if (labelled && changed) nodes.push(whoRow(u.speaker, colour));
    // A turn runs on as one paragraph until the speaker changes, pauses, or has said a good deal.
    if (changed || !turn || u.start - before.end > TURN_PAUSE_MS || chars > TURN_CHARS) {
      const minute = Math.floor(u.start / 60000);
      const text = el("p", {});
      turn = el("div", { className: "turn" },
        el("time", { textContent: minute === lastTimed ? "" : clock.format(new Date(u.start)) }), text);
      lastTimed = minute;
      if (colour) { turn.classList.add("tinted"); turn.style.setProperty("--who", colour); }
      nodes.push(turn);
      chars = 0;
    }
    turn.lastChild.append(saying(u), " ");
    chars += u.text.length;
  });
  const words = el("div", { className: "words" }, ...nodes);
  const remove = deleteButton(g);
  if (!hasNotes(g)) return [el("div", { className: "viewbar" }, copy, remove), words];

  const notes = el("div", { className: "notes" });
  const sides = { notes: el("button", { textContent: "Notes" }), transcript: el("button", { textContent: "Transcript" }) };
  g.show = (view) => {
    viewChosen.set(g.key, view);
    notes.hidden = view !== "notes";
    words.hidden = view === "notes";
    for (const [name, button] of Object.entries(sides)) button.setAttribute("aria-pressed", String(name === view));
    refreshTalk();
  };
  for (const [name, button] of Object.entries(sides)) button.addEventListener("click", () => {
    viewWanted = name;
    try { localStorage.setItem("limitful-view", name); } catch { /* applies until the page closes */ }
    g.show(name);
  });
  const points = pointsOf(g);
  const written = g.notes || [];
  if (written.length) {
    // The most important first, each with the moment it was said: a note can always be checked against the words.
    notes.append(el("ul", { className: "taken" }, ...written.map((note) => {
      const row = el("li", {}, el("span", { textContent: note.text }));
      const said = note.line && g.own.find((u) => u.id === note.line);
      if (said) {
        const at = el("button", { className: "at", title: "Read where this was said" }, clock.format(new Date(said.start)));
        at.addEventListener("click", () => reveal(said.id, true));
        row.append(at);
      }
      return row;
    })));
  } else if (points.length) notes.append(el("ul", { className: "points" }, ...points.map((t) => el("li", { textContent: t }))));
  else if (g.notes) notes.append(el("p", { className: "nothing", textContent: "Nothing in this one was worth a note." }));
  // What is still to be done after it: this conversation's reminders, kept or dismissed here too.
  const owed = g.reminders.filter((r) => r.status === "suggested" || r.status === "accepted");
  if (g.notes && owed.length) notes.append(el("h4", { textContent: "Reminders" }), el("ul", { className: "owed" }, ...owed.map((r) =>
    el("li", {}, el("span", { textContent: r.text }), reminderActs(r, () => { renderDay(); countReminders(); }, null)))));
  if (g.sections.length) {
    // The outline: each topic opens the transcript where it begins.
    const outline = el("ul", { className: "covered" }, ...g.sections.map((heading, n) => {
      const to = el("button", { className: heading.level === 2 ? "" : "sub", title: "Read from here" },
        el("time", { textContent: clock.format(new Date(heading.start)) }), el("span", { textContent: heading.title }));
      to.addEventListener("click", () => { g.show("transcript"); marks[n]?.scrollIntoView({ block: "center" }); });
      return el("li", {}, to);
    }));
    // Beside notes proper the outline is only a way around, so it stays folded.
    if (g.notes) notes.append(el("details", { className: "topics" }, el("summary", { textContent: count(g.sections.length, "topic") }), outline));
    else notes.append(el("h4", { textContent: "What it covered" }), outline);
  }
  g.show(viewOf(g));
  return [el("div", { className: "viewbar" }, el("div", { className: "seg", role: "group", ariaLabel: "What to show" }, sides.notes, sides.transcript), copy, remove), notes, words];
}

function asMarkdown(g) {
  const out = [`# ${g.title || "Conversation"}`, ""];
  const headings = [...g.sections];
  for (const u of g.own) {
    while (headings.length && headings[0].start <= u.start) {
      const heading = headings.shift();
      out.push("", `${"#".repeat(heading.level)} ${heading.title}`, "");
    }
    out.push(`- **${clockSec.format(new Date(u.start))}** ${u.speaker ? `${u.speaker.name}: ` : ""}${u.text}`);
  }
  return out.join("\n") + "\n";
}

/* Open the card holding a line and bring the line into view. */
function reveal(id, mark) {
  const g = groups.find((x) => x.own.some((u) => u.id === id));
  if (!g) return;
  g.setOpen(true);
  if (g.show) g.show("transcript");  // a line is in the transcript, whichever side was showing
  const node = $(`u${id}`);
  if (!node) return;
  node.scrollIntoView({ block: "center" });
  if (mark) document.querySelectorAll(".found").forEach((n) => n.classList.remove("found"));
  if (mark) node.classList.add("found"); else node.focus({ preventScroll: true });
}

/* True while the day view is showing this day: answers that arrive after leaving it are dropped. */
const onDay = (key) => day === key && !searching && !reminding && !peopling && !configuring && !asking && !welcoming;

async function openDay(key, revealId, revealTalk, startPlaying) {
  leaveWelcome();
  document.querySelector("header").classList.remove("plain");
  searching = false;
  reminding = false;
  peopling = false;
  configuring = false;
  asking = false;
  $("ask").setAttribute("aria-pressed", "false");
  $("remind").setAttribute("aria-pressed", "false");
  $("who").setAttribute("aria-pressed", "false");
  $("settings").setAttribute("aria-pressed", "false");
  $("search").value = "";
  day = key;
  wanted = revealId || revealTalk
    ? { line: revealId || null, talk: revealTalk || null, start: Boolean(startPlaying) } : null;
  visit(`#${key}`);
  try {
    const [gotLines, gotTalks] = await Promise.all([get(`/api/day/${key}`), get(`/api/conversations/${key}`)]);
    if (!onDay(key)) return;  // moved on while this was loading
    lines = gotLines; talks = gotTalks;
    renderDay();
  } catch (err) {
    if (!onDay(key)) return;
    main.replaceChildren(el("p", { className: "empty", textContent: `Could not load this day. ${err.message}` }));
  }
}

function step(direction) {
  const known = days.map((d) => d.day);
  const target = direction < 0
    ? known.filter((d) => d < day).pop()
    : known.find((d) => d > day);
  if (target) openDay(target);
}

/* Search can be kept to what one person said: `from:elena pilot`, or `from:"Elena Ruiz" pilot`.
   Only speakers somebody has named can be asked for. */
let named = [];  // their names, most recently heard first
async function loadPeople() {
  try { named = (await get("/api/people")).map((p) => p.name); } catch { /* search still works without names */ }
}
function peopleLike(typed) {
  const low = typed.toLowerCase();
  const exact = named.filter((name) => name.toLowerCase() === low);
  if (exact.length) return exact;
  return named.filter((name) => name.toLowerCase().startsWith(low) || name.toLowerCase().split(/\s+/).some((word) => word.startsWith(low)));
}
/* What was typed, taken apart: the words to look for, and whose lines (`by`) if `from:` names one person. */
function readQuery(text) {
  const found = text.match(/(?:^|\s)from:(?:"([^"]*)"|(\S+))/i);
  if (!found) return { words: text.trim(), typed: null, by: null, fits: [] };
  const typed = (found[1] || found[2] || "").trim();
  const fits = typed ? peopleLike(typed) : [];
  return { words: text.replace(found[0], " ").replace(/\s+/g, " ").trim(), typed, by: fits.length === 1 ? fits[0] : null, fits };
}
const searchUrl = (path, q) => `${path}?q=${encodeURIComponent(q.words)}${q.by ? `&by=${encodeURIComponent(q.by)}` : ""}`;
const fromText = (name, words = "") => `from:${/\s/.test(name) ? `"${name}"` : name}${words ? ` ${words}` : ""}`;

async function runSearch(query) {
  leaveWelcome();
  document.title = "Lifelog, search";
  document.querySelector("header").classList.add("plain");
  searching = true;
  reminding = false;
  peopling = false;
  configuring = false;
  asking = false;
  $("ask").setAttribute("aria-pressed", "false");
  $("remind").setAttribute("aria-pressed", "false");
  $("who").setAttribute("aria-pressed", "false");
  $("settings").setAttribute("aria-pressed", "false");
  $("title").textContent = "Search";
  strip.replaceChildren();
  if (query.toLowerCase().includes("from:")) await loadPeople();
  const q = readQuery(query);
  if (q.typed !== null && !q.by) {
    const why = q.fits.length > 1 ? `Several people fit “${q.typed}”: ${q.fits.join(", ")}. Type more of the name.`
      : `No one you have named fits “${q.typed}”. Name a speaker in a conversation first, then search what they said.`;
    main.replaceChildren(el("p", { className: "empty", textContent: why }));
    return;
  }
  let results;
  try {
    results = await get(searchUrl("/api/search", q));
  } catch (err) {
    main.replaceChildren(el("p", { className: "empty", textContent: `Search failed. ${sentence(err.message)}` }));
    return;
  }
  if ($("search").value.trim() !== query) return;  // a newer search is on its way
  const listed = (lines) => {
    const nodes = [];
    let last = null, moment;
    for (const u of lines) {
      // A new day gets its date; a new moment (a few lines that belong together) too.
      if (u.day !== last || u.moment !== moment) {
        last = u.day;
        moment = u.moment;
        const a = el("a", { href: `#${u.day}`, textContent: longDay.format(new Date(dayStart(u.day))) });
        a.addEventListener("click", (e) => { e.preventDefault(); openDay(u.day); });
        nodes.push(el("h2", {}, a));
      }
      nodes.push(lineButton(u, u.day));
    }
    return nodes;
  };
  // Exact matches: the words marked, with the line before and after and the conversation it is from.
  const words = new RegExp(`(${q.words.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig");
  const marked = (text) => q.words ? text.split(words).map((part, n) => n % 2 ? el("mark", { textContent: part }) : part) : [text];
  const clip = (text) => text.length > 140 ? `${text.slice(0, 140)}…` : text;
  const hits = (found) => {
    const nodes = [];
    let last = null;
    for (const u of found) {
      if (u.day !== last) {
        last = u.day;
        const a = el("a", { href: `#${u.day}`, textContent: longDay.format(new Date(dayStart(u.day))) });
        a.addEventListener("click", (e) => { e.preventDefault(); openDay(u.day); });
        nodes.push(el("h2", {}, a));
      }
      const where = [u.speaker?.name, u.talk ? `in “${u.talk}”` : null].filter(Boolean).join(", ");
      const b = el("button", { className: "hit", title: "Open this moment" },
        el("time", { textContent: clock.format(new Date(u.start)) }),
        el("div", {},
          ...(where ? [el("small", { textContent: where })] : []),
          ...(u.before ? [el("p", { className: "around", textContent: clip(u.before) })] : []),
          el("p", { className: "said" }, ...marked(u.text)),
          ...(u.after ? [el("p", { className: "around", textContent: clip(u.after) })] : [])));
      b.addEventListener("click", () => openDay(u.day, u.id));
      nodes.push(b);
    }
    return nodes;
  };
  // Whose lines these are, when the search is kept to one person; the cross takes that away.
  const chip = [];
  if (q.by) {
    const drop = el("button", { title: "Search everyone", ariaLabel: `Stop keeping to ${q.by}` }, "✕");
    drop.addEventListener("click", () => {
      if (!q.words) { openDay(day); return; }
      $("search").value = q.words; runSearch(q.words);
    });
    chip.push(el("span", { className: "saidby" }, `Said by ${q.by}`, drop), " ");
  }
  const what = q.words ? ` with “${q.words}”` : "";
  const tally = el("p", { className: "tally" }, ...chip,
    results.length ? `${count(results.length, "line")}${what}, newest first.` : "");
  main.replaceChildren(...(results.length ? [tally, ...hits(results)]
    : [...(q.by ? [tally] : []), el("p", { className: "empty", textContent: q.words ? `Nothing found for “${q.words}”${q.by ? ` in what ${q.by} said` : ""}.` : `Nothing ${q.by} said is on record.` })]));
  if (!q.words) return;  // nothing to be close in meaning to
  /* Lines that say it in other words, if the index has been built (Settings). They go
     under the exact matches, labelled, so those are never pushed down or mixed up. */
  let near;
  try {
    near = await get(searchUrl("/api/search/meaning", q));
  } catch (err) {
    return;  // the exact matches are already on the page
  }
  if (!searching || $("search").value.trim() !== query) return;
  const exact = new Set(results.map((u) => u.id));
  const shown = new Set(near.lines.filter((u) => exact.has(u.id)).map((u) => u.moment));
  const extra = near.lines.filter((u) => !shown.has(u.moment));  // moments not already listed above
  if (!extra.length) return;
  main.append(
    el("p", { className: "near", textContent: "Close in meaning, closest first. These moments may not contain your words." }),
    ...listed(extra));
}

/* Playback. One audio element plays a "track": the recordings behind one conversation,
   end to end, so the timeline covers the whole conversation and not one short file. */
let track = null;  // { key, last, pieces: [{ audio, from, to, base }], total, at }
const seek = $("seek");
let scrubbing = false;

function buildTrack(u) {
  const g = groups.find((x) => x.own.some((v) => v.id === u.id));
  const own = (g ? g.own : [u]).filter((v) => v.audio);
  const pieces = [];
  for (const v of own) {
    const from = v.offset / 1000, to = (v.offset + (v.end - v.start)) / 1000 + 1;
    const last = pieces[pieces.length - 1];
    if (last && last.audio === v.audio) last.to = Math.max(last.to, to);
    else pieces.push({ audio: v.audio, from, to });
  }
  let base = 0;
  for (const p of pieces) { p.base = base; base += p.to - p.from; }
  return { key: g ? g.key : `u${u.id}`, last: own[own.length - 1], pieces, total: base, at: 0, day };
}

/* Move the audio element to a time in a recording, loading the file if needed. */
let cueWanted = null;  // where to go once the file has loaded; only the newest request counts
function cue(path, time, start) {
  cueWanted = { time, start };
  const go = () => {
    const want = cueWanted;
    if (!want) return;
    cueWanted = null;
    audio.currentTime = want.time;
    // A page opened from a link (an Obsidian "Listen" link) may not start sound by itself:
    // then the player waits on Play, focused, so one click or Space starts it.
    if (want.start) audio.play().catch(() => { $("toggle").textContent = "Play"; $("toggle").focus(); });
  };
  if (audio.dataset.src !== path) {
    audio.dataset.src = path;
    audio.src = path;
    audio.addEventListener("loadedmetadata", go, { once: true });
  } else if (audio.readyState >= 1) go();
  // Otherwise the file is still loading, and the listener already waiting takes the newest request.
}

function play(u) {
  if (!u.audio) return;  // imported line with no recording
  playing = u;
  const g = groups.find((x) => x.own.some((v) => v.id === u.id));
  if (!track || track.key !== (g ? g.key : `u${u.id}`)) track = buildTrack(u);
  track.at = Math.max(0, track.pieces.findIndex((p) => p.audio === u.audio));
  cue(u.audio, u.offset / 1000, true);
  markPlaying();
  showPosition();
}

/* Where we are in the conversation, in seconds from its start. */
function position() {
  const p = track.pieces[track.at];
  return p.base + Math.min(Math.max(0, audio.currentTime - p.from), p.to - p.from);
}

function jumpTo(seconds) {
  if (!track) return;
  const want = Math.min(Math.max(0, seconds), Math.max(0, track.total - 0.3));
  let i = track.pieces.findIndex((p) => want < p.base + (p.to - p.from));
  if (i < 0) i = track.pieces.length - 1;
  const p = track.pieces[i];
  track.at = i;
  cue(p.audio, p.from + (want - p.base), !audio.paused);
}

/* The end of a recording, or of this conversation's part of it: carry on with what follows. */
function advance() {
  if (track.at + 1 < track.pieces.length) {
    track.at += 1;
    const p = track.pieces[track.at];
    cue(p.audio, p.from, true);
    return;
  }
  // Only carry on into the next line while the day being played is still the one on screen.
  const next = track.day === day ? lines.find((u) => u.audio && u.start > track.last.start) : null;
  if (next) play(next); else { playing = null; track = null; markPlaying(); }
}

/* The amber line on the strip showing where playback is in the day. */
function movePlayhead() {
  const head = $("head");
  if (!head) return;
  const here = playing && lines.some((u) => u.id === playing.id) && playing.start >= span.from && playing.start <= span.to;
  head.hidden = !here;
  if (here) head.style.left = along(playing.start);
}

// Follow the rendered height as the player wraps, resizes or becomes hidden.
function measurePlayer() {
  document.body.style.setProperty("--player", `${$("player").offsetHeight}px`);
}
new ResizeObserver(measurePlayer).observe($("player"));

function markPlaying() {
  document.querySelectorAll(".on").forEach((n) => n.classList.remove("on"));
  $("player").hidden = !playing;
  if (!playing) movePlayhead();
  measurePlayer();
  if (!playing) return;
  $(`u${playing.id}`)?.classList.add("on");
  movePlayhead();
  const t = new Date(playing.start);
  $("now").replaceChildren(el("time", { textContent: clockSec.format(t) }), playing.text);
}

const stamp = (seconds) => {
  const s = Math.max(0, Math.floor(seconds));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`;
};

function showPosition() {
  if (!track) return;
  seek.max = track.total;
  $("total").textContent = stamp(track.total);
  if (scrubbing) return;  // the reader's hand wins over the playhead
  const at = position();
  seek.value = at;
  $("at").textContent = stamp(at);
  seek.setAttribute("aria-valuetext", `${stamp(at)} of ${stamp(track.total)}`);
}

audio.addEventListener("timeupdate", () => {
  if (!playing || !track) return;
  const piece = track.pieces[track.at];
  if (!audio.seeking && audio.dataset.src === piece.audio && audio.currentTime > piece.to + 0.25) {
    advance();
    return;
  }
  const at = audio.currentTime * 1000;
  const same = lines.filter((u) => u.audio === audio.dataset.src && u.offset <= at + 150);
  const current = same[same.length - 1];
  if (current && current.id !== playing.id) { playing = current; markPlaying(); }
  showPosition();
});
audio.addEventListener("seeked", showPosition);
audio.addEventListener("ended", () => { if (track) advance(); });
audio.addEventListener("play", () => { $("toggle").textContent = "Pause"; });
audio.addEventListener("pause", () => { $("toggle").textContent = "Play"; });
audio.addEventListener("error", () => {
  if (!playing) return;
  $("now").textContent = "This recording could not be played. Chrome and Firefox play these files; older Safari does not.";
});
$("toggle").addEventListener("click", () => audio.paused ? audio.play().catch(() => {}) : audio.pause());
seek.addEventListener("input", () => { scrubbing = true; $("at").textContent = stamp(seek.value); });
seek.addEventListener("change", () => { scrubbing = false; jumpTo(Number(seek.value)); });
$("back").addEventListener("click", () => jumpTo(position() - 10));
$("ahead").addEventListener("click", () => jumpTo(position() + 10));

strip.addEventListener("click", (e) => {
  if (!lines.length) return;
  const box = strip.getBoundingClientRect();
  const at = span.from + ((e.clientX - box.left) / box.width) * (span.to - span.from);
  // Inside a conversation, go to its start; otherwise to the nearest line.
  const g = groupAt(at);
  const nearest = g ? g.own[0] : lines.reduce((a, b) => Math.abs(b.start - at) < Math.abs(a.start - at) ? b : a);
  reveal(nearest.id, false);
});

const count = (n, word) => `${n.toLocaleString()} ${word}${n === 1 ? "" : "s"}`;
const imported = (r) => `Imported ${count(r.conversations, "conversation")}, ${count(r.lines, "line")} and ${count(r.hours, "hour")} of audio.${r.indexing ? " Now adding the new lines to search by meaning." : ""}`;

/* A notice that something is done, which clears itself. */
function sayDone(text) {
  say(text);
  sayTimer = setTimeout(() => say(""), 8000);
}
/* A reason as the server or a library gave it, as a sentence: "could not reach `x`" -> "Could not reach x." */
const sentence = (text) => {
  const s = String(text || "").replace(/`/g, "").trim();
  return s ? `${s[0].toUpperCase()}${s.slice(1)}${/[.!?…]$/.test(s) ? "" : "."}` : "";
};
const withAdvice = (error, advice) => `${error}${/[.!?]$/.test(error) ? "" : "."}${advice ? ` ${advice}` : ""}`;

/* Importing a Limitless export, and the slower speaker recognition that follows it. */
let sayTimer = null, toldError = null;
function say(text, failed) {
  clearTimeout(sayTimer);
  const box = $("status");
  box.hidden = !text;
  box.textContent = text || "";
  box.classList.toggle("failed", Boolean(failed));
}

/* A notice of work under way, with a bar: `fraction` from 0 to 1, or null when it cannot be known. */
function sayBusy(text, fraction) {
  say(text);
  const known = typeof fraction === "number";
  const bar = el("span", { className: known ? "bar" : "bar unknown", role: "progressbar", ariaLabel: text },
    el("i", { style: known ? `width: ${Math.round(Math.max(0, Math.min(1, fraction)) * 100)}%` : "" }));
  if (known) bar.setAttribute("aria-valuenow", String(Math.round(fraction * 100)));
  $("status").append(bar);
}

let watching = null;
async function watchJob() {
  let job;
  try { job = await get("/api/status"); } catch { return; }
  document.querySelectorAll(".busy-off").forEach((b) => { b.disabled = job.running; });
  if (job.running) {
    if (job.percent != null) {
      const which = job.total > 1 ? `, recording ${Math.min(job.done + 1, job.total)} of ${job.total}` : "";
      sayBusy(`${job.what}: ${job.percent}%${which}. You can keep using the page.`, job.percent / 100);
    } else if (job.total) {
      sayBusy(`${job.what}: ${job.done.toLocaleString()} of ${job.total.toLocaleString()}. You can keep using the page.`, job.done / job.total);
    } else {
      sayBusy(`${job.what}…`, null);
    }
    if (job.stoppable && !job.what.includes("stopping")) {
      const halt = el("button", { className: "halt" }, ...withIcon("stop", "Stop", 14));
      halt.addEventListener("click", async () => {
        halt.disabled = true;
        try { await post("/api/upkeep", { action: "stop" }); } catch { /* it finished first */ }
        watchJob();
      });
      $("status").append(" ", halt);
      $("status").append($("status").querySelector(".bar"));  // the bar stays underneath
    }
    if (!watching) watching = setInterval(watchJob, 1500);
    return;
  }
  if (watching) {
    clearInterval(watching);
    watching = null;
    toldError = job.error;
    if (transcribeNext && !job.error) return transcribeAdded();  // recordings were added while this ran
    if (job.error) say(withAdvice(job.error, job.advice), true); else sayDone(job.note || "Finished.");
    if (showNext && !job.error) { day = showNext; showNext = null; }
    if (configuring) showSettings();
    try { days = await get("/api/days"); } catch { /* keep what we had */ }
    if (!searching && !reminding && !peopling && !configuring && !asking && !welcoming) openDay(day);
  } else if (job.error && job.error !== toldError) {
    toldError = job.error;  // an old failure is shown once, not on every visit to Settings
    say(withAdvice(job.error, job.advice), true);
  }
}

$("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  document.querySelectorAll(".busy-off").forEach((b) => { b.disabled = true; });
  say(`Importing ${file.name}. Large exports take a minute; keep this page open.`);
  try {
    const res = await fetch("/api/import", { method: "POST", headers: { "Content-Type": "application/zip" }, body: file });
    if (!res.ok) throw new Error(await res.text());
    const r = await res.json();
    const added = r.conversations
      ? imported(r)
      : "Nothing new in that export.";
    say(r.skipped ? `${added} ${count(r.skipped, "conversation")} ${r.skipped === 1 ? "was" : "were"} already here.` : added);
    try { days = await get("/api/days"); } catch { /* keep what we had */ }
    countReminders();
    if (r.conversations && days.length) openDay(days[days.length - 1].day);
    watchJob();
  } catch (err) {
    say(`Import failed. ${sentence(err.message)}`, true);
    document.querySelectorAll(".busy-off").forEach((b) => { b.disabled = false; });
  }
});

/* Recordings made elsewhere (a Voice Memo, any audio file): dropped anywhere on the page or
   chosen in Settings. Each is filed at the moment it was recorded, then transcribed. */
const AUDIO_FILE = /\.(m4a|mp3|wav|aac|mp4|mov|caf|aiff?|flac|ogg|opus|webm|qta|amr|3gp|wma)$/i;
let transcribeNext = false, showNext = null;
async function transcribeAdded() {
  transcribeNext = false;
  try { await post("/api/transcribe", {}); } catch { transcribeNext = true; }  // something else is running: after it
  watchJob();
}
async function addRecordings(files) {
  const audio = [...files].filter((f) => AUDIO_FILE.test(f.name));
  if (!audio.length) return say("Those are not audio files. Add recordings such as .m4a, .mp3 or .wav.", true);
  let added = 0, already = 0;
  const failed = [];
  for (const [i, file] of audio.entries()) {
    sayBusy(`Adding ${file.name}${audio.length > 1 ? ` (${i + 1} of ${audio.length})` : ""}…`, audio.length > 1 ? i / audio.length : null);
    try {
      const res = await fetch("/api/recordings", { method: "POST", body: file, headers: {
        "Content-Type": "application/octet-stream", "X-Name": encodeURIComponent(file.name), "X-Modified": String(file.lastModified || 0) } });
      if (!res.ok) throw new Error(await res.text());
      const r = await res.json();
      if (!r.added) { already += 1; continue; }
      added += 1;
      if (!showNext || r.day > showNext) showNext = r.day;
    } catch (err) {
      failed.push(`${file.name}: ${sentence(err.message)}`);
    }
  }
  const notes = [];
  if (added) notes.push(`Added ${count(added, "recording")}.`);
  if (already) notes.push(`${count(already, "recording")} ${already === 1 ? "was" : "were"} already here.`);
  if (failed.length) notes.push(`Could not add ${failed.join(" ")}`);
  say(notes.join(" "), Boolean(failed.length));
  if (added && !failed.length) transcribeAdded();
  else if (added) { try { await post("/api/transcribe", {}); } catch { transcribeNext = true; } }  // keep the failure on screen
}

{
  let depth = 0;
  const carriesFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  window.addEventListener("dragenter", (e) => { if (carriesFiles(e)) { e.preventDefault(); depth += 1; $("drop").hidden = false; } });
  window.addEventListener("dragover", (e) => { if (carriesFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } });
  window.addEventListener("dragleave", (e) => { if (carriesFiles(e) && (depth -= 1) <= 0) { depth = 0; $("drop").hidden = true; } });
  window.addEventListener("drop", (e) => {
    if (!carriesFiles(e)) return;
    e.preventDefault();
    depth = 0;
