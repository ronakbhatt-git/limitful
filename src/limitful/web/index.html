/* Ask: questions about what was said, answered from the transcripts with links to the lines. */
const shortWhen = new Intl.DateTimeFormat([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

/* An answer is plain text with "- " lists, **bold** and [L123] citations. Build it as nodes. */
function replyNodes(text, cited) {
  const inline = (line) => {
    const out = [];
    for (const part of line.split(/(\*\*[^*]+\*\*|\[L\d+\])/)) {
      const ref = part.match(/^\[L(\d+)\]$/);
      if (ref) {
        const where = cited[ref[1]];
        if (!where) continue;  // an id the model was never shown
        const a = el("a", { className: "cite", href: `#${where.day}/${ref[1]}`, title: `“${where.text}”`,
          textContent: shortWhen.format(new Date(where.start)) });
        a.addEventListener("click", (e) => { e.preventDefault(); openDay(where.day, Number(ref[1]), where.conversation, true); });
        out.push(a);
      } else if (/^\*\*[^*]+\*\*$/.test(part)) out.push(el("b", { textContent: part.slice(2, -2) }));
      else if (part) out.push(part);
    }
    return out;
  };
  const nodes = [];
  for (const block of text.split(/\n\s*\n/)) {
    let list = null, para = [];
    const flush = () => { if (para.length) { nodes.push(el("p", {}, ...inline(para.join(" ")))); para = []; } };
    for (const line of block.split("\n")) {
      const item = line.match(/^\s*[-*•]\s+(.*)$/);
      if (item) {
        flush();
        if (!list) { list = el("ul"); nodes.push(list); }
        list.append(el("li", {}, ...inline(item[1])));
      } else { list = null; para.push(line.trim()); }
    }
    flush();
  }
  return nodes;
}

function showAsk(question) {
  leaveWelcome();
  document.title = "Lifelog, ask";
  asking = true;
  searching = false; reminding = false; peopling = false; configuring = false;
  visit("#ask");
  for (const [id, on] of [["ask", true], ["remind", false], ["settings", false]]) $(id).setAttribute("aria-pressed", String(on));
  $("title").textContent = "Ask";
  strip.replaceChildren();
  document.querySelector("header").classList.add("plain");

  const thread = el("div", { className: "thread" });
  const side = el("aside", { className: "side", ariaLabel: "Your chats" });
  const box = el("div", { className: "chat" }, thread, side);
  // What Claude is doing right now, with the mark turning while it works.
  const workingText = el("span");
  const working = el("p", { className: "working", role: "status", hidden: true }, star(20), workingText);
  const tell = (text, { busy = false, failed = false } = {}) => {
    workingText.textContent = text;
    working.hidden = !text;
    working.classList.toggle("busy", busy);
    working.classList.toggle("failed", failed);
  };
  const field = el("textarea", { rows: 1, placeholder: "Ask about anything you've said or heard", ariaLabel: "Your question" });
  const go = el("button", { type: "submit", ariaLabel: "Send question", title: "Send question" }, icon("send", 20));
  const form = el("form", { className: "composer" }, field, go);
  const grow = () => { field.style.height = "auto"; field.style.height = `${Math.min(field.scrollHeight, 192)}px`; };

  const paintSide = () => {
    const fresh = el("button", { className: "pill new", type: "button" }, ...withIcon("plus", "New chat", 16));
    fresh.addEventListener("click", () => { if (!chatBusy) { chat = []; chatId = null; paint(); field.focus(); } });
    const rows = threads.map((t) => {
      const open = el("button", { className: "open", type: "button", textContent: t.title, title: t.title });
      open.addEventListener("click", () => loadThread(t.id));
      const remove = el("button", { className: "remove", type: "button", textContent: "Delete", ariaLabel: `Delete the chat “${t.title}”` });
      remove.addEventListener("click", async () => {
        if (!remove.classList.contains("sure")) { remove.classList.add("sure"); remove.textContent = "Really?"; return; }
        try {
          await post(`/api/chats/${t.id}/delete`, {});
          threads = await get("/api/chats");
          if (t.id === chatId) { chat = []; chatId = null; }
          paint();
        } catch (err) { remove.textContent = "Failed"; }
      });
      const when = `${shortWhen.format(new Date(t.updated))}, ${t.questions} question${t.questions === 1 ? "" : "s"}`;
      return el("div", { className: t.id === chatId ? "row now" : "row" }, open, remove, el("small", { textContent: when }));
    });
    side.replaceChildren(
      el("h3", {}, ...withIcon("chats", "Chats", 16)),
      fresh,
      ...(rows.length ? rows : [el("p", { className: "none", textContent: "Your chats are saved here, on this computer." })]));
  };

  const paint = () => {
    const turns = [];
    for (const turn of chat) {
      if (turn.role === "user") turns.push(el("p", { className: "asked", textContent: turn.content }));
      else turns.push(el("div", { className: "answer" }, star(20), el("div", { className: "reply" }, ...replyNodes(turn.content, turn.lines || {}))));
    }
    const tries = [
      ["reminders", "What did I agree to do this week?"],
      ["people", "Who did I talk to most recently, and about what?"],
      ["day", "What were the main things discussed on my busiest day?"],
    ].map(([name, q]) => {
      const b = el("button", { type: "button" }, icon(name, 20), el("span", { textContent: q }));
      b.addEventListener("click", () => send(q));
      return b;
    });
    const hero = chat.length ? [] : [el("div", { className: "hero" },
      star(64),
      el("h2", { textContent: "What do you want to find?" }),
      el("p", { textContent: "Ask what was said, what you agreed to, or when something came up. Every answer links to the lines it came from, so you can hear the moment." }),
      el("div", { className: "tries" }, ...tries))];
    thread.replaceChildren(...hero, ...turns, working, el("div", { className: "dock" }, form,
      el("p", { className: "fine", textContent: "Your questions and the transcript lines Claude reads are sent to Anthropic." })));
    paintSide();
    grow();
  };

  const loadThread = async (id) => {
    if (chatBusy) return;
    try { chat = await get(`/api/chats/${id}`); chatId = id; tell(""); paint(); field.focus(); }
    catch (err) { tell(`Could not open that chat. ${err.message}`, { failed: true }); }
  };

  const send = async (question) => {
    question = question.trim();
    if (!question || chatBusy) return;
    chatBusy = true;
    chat.push({ role: "user", content: question });
    field.value = "";
    paint();
    go.disabled = true;
    tell("Thinking…", { busy: true });
    working.scrollIntoView({ block: "nearest" });
    let failure = null;
    // The answer appears as it is written. Citations become links once it is complete.
    let draft = "";
    const liveBody = el("div", { className: "reply" });
    const live = el("div", { className: "answer" }, star(20), liveBody);
    const drawDraft = () => {
      const shown = draft.replace(/\[L\d+\]/g, "").replace(/\[L?\d*$/, "").replace(/\*\*?$/, "");
      liveBody.replaceChildren(...replyNodes(shown, {}));
      if (!live.isConnected && shown.trim()) working.before(live);
      if (asking) form.scrollIntoView({ block: "nearest" });
    };
    try {
      const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, chat: chatId }) });
      if (!res.ok) throw new Error(await res.text());
      const reader = res.body.getReader(), decoder = new TextDecoder();
      let buffer = "", done = false;
      const take = (line) => {
        if (!line.trim()) return;
        const item = JSON.parse(line);
        if (item.step) tell(`${item.step}…`, { busy: true });
        else if (item.text === null) { draft = ""; live.remove(); }
        else if (typeof item.text === "string") {
          if (!draft) tell("");
          draft += item.text;
          drawDraft();
        }
        else if (item.error) failure = item.error;
        else if (item.answer) {
          chat.push({ role: "assistant", content: item.answer, lines: item.lines });
          chatId = item.chat;
          done = true;
        }
      };
      for (;;) {
        const { value, done: ended } = await reader.read();
        if (value) {
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n");
          buffer = parts.pop();
          parts.forEach(take);
        }
        if (ended) { take(buffer); break; }
      }
      if (!done && !failure) failure = "The answer was cut off. Try again.";
    } catch (err) { failure = err.message; }
    chatBusy = false;
    live.remove();
    if (!failure) { try { threads = await get("/api/chats"); } catch { /* the list catches up next time */ } }
    if (!form.isConnected) {
      // Ask was left while this was being answered. If it is open again, that is a new
      // page waiting on us: draw it afresh, with the answer or the question to retry.
      if (failure) chat.pop();
      if (asking) showAsk();
      return;
    }
    if (failure) {
      chat.pop();  // the question was not answered; put it back in the box to retry
      if (asking) { paint(); field.value = question; grow(); }
    } else if (asking) paint();
    go.disabled = false;
    tell(failure ? `No answer. ${sentence(failure)}` : "", { failed: Boolean(failure) });
    if (asking) { (failure ? working : form).scrollIntoView({ block: "nearest" }); field.focus(); }
  };

  form.addEventListener("submit", (e) => { e.preventDefault(); send(field.value); });
  field.addEventListener("input", grow);
  field.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(field.value); }
  });
  paint();
  main.replaceChildren(box);
  get("/api/chats").then((list) => { threads = list; if (asking && !chatBusy) paint(); }).catch(() => {});
  if (chatBusy) { go.disabled = true; tell("Still working on the last question…", { busy: true }); }
  // A question handed over from quick find waits in the box: sending it is the reader's choice.
  else if (typeof question === "string" && question) { field.value = question; grow(); }
  field.focus();
}

/* Quick find (⌘K or Ctrl+K): one box that goes to a day or a page, or finds what was said. */
const quick = $("quick"), quickIn = $("quickIn"), quickList = $("quickList");
const MONTHS = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
const WEEKDAYS = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
const briefDay = new Intl.DateTimeFormat([], { day: "numeric", month: "short" });
const briefDayYear = new Intl.DateTimeFormat([], { day: "numeric", month: "short", year: "numeric" });
let quickRows = [];    // [{ key, node, run }], in the order shown
let quickOn = null;    // key of the row Enter would open
let quickFound = { query: null, words: [], near: [] };
let quickTimer, quickSeq = 0;

/* Recorded days that fit a typed date, newest first: "today", "12 nov", "thursday",
   "march 2025", "2026-11-12". `sure` when it can hardly be anything but a date. */
function daysLike(query) {
  const none = { days: [], sure: false };
  const known = days.map((d) => d.day);
  const q = query.toLowerCase().replace(/,/g, " ").trim();
  const back = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return dayKey(d); };
  const exact = q === "today" ? back(0) : q === "yesterday" ? back(1) : /^\d{4}-\d{2}-\d{2}$/.test(q) ? q : null;
  if (exact) return { days: known.includes(exact) ? [exact] : [], sure: true };
  const want = {};
  for (const word of q.split(/\s+/)) {
    const n = word.match(/^(\d{1,2})(st|nd|rd|th)?$/);
    const named = (names) => word.length >= 3 ? names.findIndex((name) => name.startsWith(word)) : -1;
    if (/^(19|20)\d{2}$/.test(word)) want.year = Number(word);
    else if (n && Number(n[1]) >= 1 && Number(n[1]) <= 31) want.date = Number(n[1]);
    else if (named(MONTHS) >= 0) want.month = named(MONTHS);
    else if (named(WEEKDAYS) >= 0) want.weekday = named(WEEKDAYS);
    else return none;
  }
  const parts = Object.keys(want).length;
  // A number alone is more likely something that was said than a day of the month.
  if (!parts || (parts === 1 && want.date !== undefined)) return none;
  const fits = known.filter((key) => {
    const d = new Date(dayStart(key));
    return (want.year === undefined || d.getFullYear() === want.year)
      && (want.month === undefined || d.getMonth() === want.month)
      && (want.date === undefined || d.getDate() === want.date)
      && (want.weekday === undefined || d.getDay() === want.weekday);
  });
  return { days: fits.reverse().slice(0, 5), sure: parts >= 2 };
}

function quickDraw() {
  const query = quickIn.value.trim();
  const rows = [];
  const add = (group, key, node, run) => rows.push({ group, key, node, run });
  const wide = (text, note) => el("div", { className: "row wide" }, el("p", { textContent: text }), el("small", { textContent: note || "" }));
  const latest = days.length ? days[days.length - 1].day : dayKey(new Date());
  const dayName = (key) => (key.slice(0, 4) === String(new Date().getFullYear()) ? thisYearDay : longDay).format(new Date(dayStart(key)));
  const pages = [
    ["Latest day", dayName(latest), () => openDay(latest)],
    ["People", "", () => showPeople()],
    ["Reminders", "", () => showReminders()],
    ["Ask", "", () => showAsk()],
    ["Settings", "", () => showSettings()],
  ];
  const addPages = (list) => list.forEach(([name, note, run]) => add("Go to", `page ${name}`, wide(name, note), run));
  const addDays = (list) => list.forEach((key) => {
    const said = days.find((d) => d.day === key);
    add("Go to", `day ${key}`, wide(dayName(key), said ? count(said.lines, "line") : ""), () => openDay(key));
  });
  if (!query) addPages(pages);
  else {
    const low = query.toLowerCase();
    const like = daysLike(query);
    addPages(pages.filter(([name]) => low.length >= 2 && name.toLowerCase().startsWith(low)));
    if (like.sure) addDays(like.days);
    const fresh = quickFound.query === query;
    const q = readQuery(query);
    const find = q.by ? (q.words ? `Search what ${q.by} said for “${q.words}”` : `Everything ${q.by} said`)
      : q.typed !== null ? (q.fits.length > 1 ? `Several people fit “${q.typed}”: type more of the name` : `No one you have named fits “${q.typed}”`)
      : `Search everything for “${query}”`;
    add("Find", "find", wide(find, fresh && quickFound.words.length ? count(quickFound.words.length, "line") : ""),
      () => { $("search").value = query; runSearch(query); });
    // A name typed on its own offers that person's lines.
    if (q.typed === null && low.length >= 2) peopleLike(low).slice(0, 3).forEach((name) => add("Said by", `who ${name}`,
      wide(`Everything ${name} said`, `or type ${fromText(name, "a word")}`), () => { const text = fromText(name); $("search").value = text; runSearch(text); }));
    if (!like.sure) addDays(like.days);
    const thisYear = String(new Date().getFullYear());
    $("quickList").classList.toggle("years", fresh
      && [...quickFound.words.slice(0, 5), ...quickFound.near].some((u) => u.day.slice(0, 4) !== thisYear));
    if (fresh) {
      const sought = q.words.toLowerCase();
      const words = new RegExp(`(${q.words.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig");
      const when = (u) => `${(u.day.slice(0, 4) === String(new Date().getFullYear()) ? briefDay : briefDayYear).format(new Date(dayStart(u.day)))}, ${clock.format(new Date(u.start))}`;
      const hit = (group, u, mark) => {
        // Long lines start a little before the words, so the match is in view.
        const at = mark ? u.text.toLowerCase().indexOf(sought) : 0;
        const text = at > 50 ? `…${u.text.slice(at - 35)}` : u.text;
        const said = el("p", { title: u.text }, ...(mark ? text.split(words).map((part, n) => n % 2 ? el("mark", { textContent: part }) : part) : [text]));
        add(group, `line ${u.id}`, el("div", { className: "row" }, el("time", { textContent: when(u) }), said), () => openDay(u.day, u.id));
      };
      quickFound.words.slice(0, 5).forEach((u) => hit(q.by ? `Said by ${q.by}` : "Said in these words", u, Boolean(q.words)));
      const exact = new Set(quickFound.words.map((u) => u.id));
      quickFound.near.filter((u) => !exact.has(u.id)).slice(0, 3).forEach((u) => hit("Close in meaning", u, false));
    }
    add("Ask", "ask", wide(`Ask: ${query}`, "Opens Ask with this question"), () => showAsk(query));
  }
  if (!rows.some((r) => r.key === quickOn)) quickOn = rows[0].key;
  const nodes = [];
  let group = null;
  rows.forEach((r, n) => {
    if (r.group !== group) { group = r.group; nodes.push(el("h3", { textContent: group })); }
    r.node.id = `quick${n}`;
    r.node.setAttribute("role", "option");
    r.node.addEventListener("click", () => quickRun(r));
    r.node.addEventListener("mousemove", () => { if (quickOn !== r.key) { quickOn = r.key; quickMark(); } });
    nodes.push(r.node);
  });
  quickRows = rows;
  quickList.replaceChildren(...nodes);
  quickMark();
}

function quickMark(scroll) {
  for (const r of quickRows) {
    const on = r.key === quickOn;
    r.node.classList.toggle("on", on);
    r.node.setAttribute("aria-selected", String(on));
    if (on) { quickIn.setAttribute("aria-activedescendant", r.node.id); if (scroll) r.node.scrollIntoView({ block: "nearest" }); }
  }
}

function quickRun(row) {
  quick.close();
  row.run();
}

if (!/Mac|iPhone|iPad/.test(navigator.platform)) $("shortcut").textContent = "Ctrl K";
// With words given (those of the full search on show), the box opens on them, selected.
function openQuick(words = "") {
  if (quick.open) { quick.close(); return; }
  closeCalendar();
  quickIn.value = words;
  quickOn = null;
  quickFound = { query: null, words: [], near: [] };
  quickDraw();
  loadPeople();  // names may have been given since the page loaded
  quick.showModal();
  quickIn.focus();
  if (words) { quickIn.select(); quickIn.dispatchEvent(new Event("input")); }
}

quickIn.addEventListener("input", () => {
  quickOn = null;
  quickDraw();
  quickList.scrollTop = 0;
  clearTimeout(quickTimer);
  const query = quickIn.value.trim(), seq = ++quickSeq;
  if (!query) return;
  quickTimer = setTimeout(async () => {
    try {
      const q = readQuery(query);
      if (q.typed !== null && !q.by) return;  // the row says why; there is nothing to look up
      const words = await get(searchUrl("/api/search", q));
      if (seq !== quickSeq || !quick.open) return;
      quickFound = { query, words, near: [] };
      quickDraw();
      if (!q.words) return;
      // Lines that say it in other words, if the index has been built (Settings).
      const near = await get(searchUrl("/api/search/meaning", q));
      if (seq !== quickSeq || !quick.open) return;
      quickFound = { query, words, near: near.lines };
      quickDraw();
    } catch { /* going to a day and the full search still work */ }
  }, 180);
});
quickIn.addEventListener("keydown", (e) => {
  const at = quickRows.findIndex((r) => r.key === quickOn);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const to = (at + (e.key === "ArrowDown" ? 1 : quickRows.length - 1)) % quickRows.length;
    quickOn = quickRows[to].key;
    quickMark(true);
  } else if (e.key === "Enter" && !e.isComposing && at >= 0) { e.preventDefault(); quickRun(quickRows[at]); }
});
// A click outside the box lands on the dialog itself, which fills the window behind it.
quick.addEventListener("click", (e) => { if (e.target === quick) quick.close(); });
quick.addEventListener("close", () => { clearTimeout(quickTimer); quickSeq++; });
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === "k") { e.preventDefault(); openQuick(); }
});

// The search box in the header is a way into quick find, by click or by key.
$("search").addEventListener("click", (e) => openQuick(e.target.value.trim()));
$("search").addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  if (e.key === "Enter" || e.key === " " || e.key === "ArrowDown") { e.preventDefault(); openQuick(e.target.value.trim()); }
  else if (e.key.length === 1) { e.preventDefault(); openQuick(); quickIn.value = e.key; quickIn.dispatchEvent(new Event("input")); }
});

document.addEventListener("keydown", (e) => {
  const typing = e.target.matches("input, textarea");
  // Escape goes back to the day, but not out of a field with something typed in it (search aside).
  if (e.key === "Escape" && (searching || reminding || peopling || configuring || asking) && (!typing || e.target.id === "search")) { openDay(day); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); openQuick(); }
  else if (e.shiftKey && track && e.key === "ArrowLeft") jumpTo(position() - 10);
  else if (e.shiftKey && track && e.key === "ArrowRight") jumpTo(position() + 10);
  else if (e.key === "ArrowLeft" && onDay(day)) step(-1);
  else if (e.key === "ArrowRight" && onDay(day)) step(1);
  else if (e.key === " " && playing && !e.defaultPrevented && !e.target.closest("button, summary, a, [role=button]")) { e.preventDefault(); $("toggle").click(); }
});

/* New lines arrive while `limitful watch` runs; pick them up quietly. */
setInterval(async () => {
  showPaused();
  if (searching || reminding || peopling || configuring || asking || welcoming || document.hidden || !day) return;
  const at = day;
  try {
    days = await get("/api/days");
    const [fresh, freshTalks] = await Promise.all([get(`/api/day/${at}`), get(`/api/conversations/${at}`)]);
    if (!onDay(at) || main.querySelector(".who input, input.retitle")) return;  // moved on, or a name or title is being typed
    if (fresh.length !== lines.length || freshTalks.length !== talks.length) {
      lines = fresh; talks = freshTalks; renderDay(); countReminders();
    }
  } catch { /* the server is away; try again next time */ }
}, 30000);

/* Each view the reader goes to gets its own place in the browser's history, so Back
   and Forward step through them. While the page is following the address (first load,
   Back, Forward, a link) the entry already exists and is only corrected. */
let arriving = true;
function visit(hash) {
  if (location.hash === hash) return;
  if (arriving) history.replaceState(null, "", hash);
  else history.pushState(null, "", hash);
}

/* A day's address: #2025-12-12, a line in it: #2025-12-12/1148, a conversation: #2025-12-12/c20.
   Adding /play starts the audio there. The lifelog repo's "Listen in Limitful" links use this. */
function openPlace(hash) {
  const [key, at, then] = hash.slice(1).split("/");
  const talk = /^c\d+$/.test(at || "") ? Number(at.slice(1)) : null;
  const line = !talk && /^\d+$/.test(at || "") ? Number(at) : null;
  return openDay(key, line, talk, then === "play");
}

/* Following a link, editing the address or pressing Back goes there without a reload. */
window.addEventListener("hashchange", () => {
  const [where, id] = location.hash.slice(1).split("/");
  arriving = true;  // every view sets the address before its first wait
  if (/^\d{4}-\d{2}-\d{2}$/.test(where)) openPlace(location.hash);
  else if (where === "reminders") showReminders();
  else if (where === "people") showPeople();
  else if (where === "settings") { if (id) settingsPane = id; showSettings(); }
  else if (where === "ask") showAsk();
  else if (where === "welcome") showWelcome();
  arriving = false;
});

(async () => {
  loadPeople();
  try {
    days = await get("/api/days");
  } catch (err) {
    day = dayKey(new Date());
    main.replaceChildren(el("p", { className: "empty", textContent: `Could not load recordings. ${err.message}` }));
    arriving = false;
    return;
  }
  const [hashDay, hashId] = location.hash.slice(1).split("/");
  if (/^\d{4}-\d{2}-\d{2}$/.test(hashDay)) await openPlace(location.hash);
  else await openDay(days.length ? days[days.length - 1].day : dayKey(new Date()));
  if (hashDay === "reminders") showReminders();
  if (hashDay === "people") showPeople();
  if (hashDay === "settings") { if (hashId) settingsPane = hashId; showSettings(); }
  if (hashDay === "ask") showAsk();
  showDemoBar();
  // An empty Lifelog that has never been set up starts with the guide.
  if (hashDay === "welcome" || (!days.length && !welcomed() && !hashDay)) showWelcome();
  arriving = false;
  watchJob();
  countReminders();
  showPaused();
})();
</script>
</body>
</html>
