  // Before anything is drawn, so a chosen theme never flashes the other one.
  try { const t = localStorage.getItem("limitful-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch { /* follow the computer */ }
</script>

<style>
  :root {
    --paper: #eef2ef;
    --ink: #13201a;
    --muted: #5e6e66;
    --rule: #d0dad3;
    --accent: #0b6b58;
    --mark: #f4c63a;
    --on-player: #f4c63a;  /* what stands out on the player bar, which is the opposite shade to the page */
    --star: #e2a900;
    --mark-ink: #2a2100;
    --voice: "Charter", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --chrome: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --gutter: 4.75rem;
    --pad: clamp(1rem, 4vw, 3rem);
    /* On screens wider than the page, everything moves in by this much so it sits centred. */
    --shift: max(0px, calc((100vw - 84rem) / 2 - var(--pad)));
    color-scheme: light dark;
    /* One colour per speaker in a conversation. */
    --who-0: #1f7a6d; --who-1: #3b6fb6; --who-2: #7a5bb5; --who-3: #b0508f;
    --bad: #b3261e;
    --who-4: #c2553a; --who-5: #a8771a; --who-6: #6f7d2a; --who-7: #5a6b7b;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0f1613;
      --ink: #e4ece7;
      --muted: #8fa097;
      --rule: #26322c;
      --accent: #63d2b6;
      --star: #f4c63a;
      --on-player: #0b6b58;
      --bad: #ff8a80;
      --who-0: #5fc3b3; --who-1: #7fa9e6; --who-2: #b29be6; --who-3: #e08fc4;
      --who-4: #ef8f76; --who-5: #dcae55; --who-6: #a9b860; --who-7: #9fb0c0;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0f1613;
    --ink: #e4ece7;
    --muted: #8fa097;
    --rule: #26322c;
    --accent: #63d2b6;
    --star: #f4c63a;
    --on-player: #0b6b58;
    --bad: #ff8a80;
    --who-0: #5fc3b3; --who-1: #7fa9e6; --who-2: #b29be6; --who-3: #e08fc4;
    --who-4: #ef8f76; --who-5: #dcae55; --who-6: #a9b860; --who-7: #9fb0c0;
    color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 11rem; }
  body {
    margin: 0;
    padding-bottom: var(--player, 0px);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--chrome);
    font-size: 15px;
    line-height: 1.4;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .welcome h2:focus { outline: none; }
  /* Read out, not shown. */
  .unseen { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

  header {
    position: sticky; top: 0; z-index: 2;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 1.1rem calc(var(--pad) + var(--shift)) 0.6rem;

  #home svg { display: block; }
  #home:hover { filter: brightness(1.12); }
  .wordmark { display: block; color: var(--ink); }
  .step {
    width: 2.25rem; height: 2.25rem;
    border: 1px solid var(--rule); border-radius: 50%;

  .step:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .step:disabled { opacity: 0.35; cursor: default; }
  /* One control for the day: an arrow either side of the date, which opens the calendar. */
  #when { position: relative; display: inline-flex; align-items: center; border: 1px solid var(--rule); border-radius: 999px; }
  #when .step { border: 0; width: 2rem; height: calc(2.25rem - 2px); border-radius: 999px; }
  /* A fixed width, so the arrows stay put while stepping through days. */
  #pick { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 500; color: var(--ink); }
  #when #pick { border: 0; padding-inline: 0.15rem; min-width: 6.5rem; }
  header.plain #when #pick { padding-inline: 0.85rem; min-width: 0; }
  #pick:hover, #pick[aria-expanded="true"] { color: var(--accent); }
  #calendar {

    background: var(--paper); border: 1px solid var(--rule); border-radius: 14px;
    box-shadow: 0 12px 32px color-mix(in srgb, var(--ink) 18%, transparent);
  }
  #calendar[hidden] { display: none; }
  #calendar .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
  #calendar .top b { font-family: var(--voice); font-size: 1.15rem; font-weight: 400; }
  #calendar .month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  #calendar .dow { text-align: center; font-size: 0.72rem; color: var(--muted); padding-bottom: 0.2rem; }
  #calendar .month button {
    aspect-ratio: 1; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
    font-size: 0.85rem; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  #calendar .month button:disabled { color: color-mix(in srgb, var(--muted) 55%, transparent); cursor: default; }
  #calendar .month button.l1, #calendar .key .l1 { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #calendar .month button.l2, #calendar .key .l2 { background: color-mix(in srgb, var(--accent) 32%, transparent); }
  #calendar .month button.l3, #calendar .key .l3 { background: color-mix(in srgb, var(--accent) 58%, transparent); }
  #calendar .month button.l4, #calendar .key .l4 { background: var(--accent); }
  #calendar .month button.l3, #calendar .month button.l4 { color: var(--paper); }
  #calendar .month button:not(:disabled):hover { box-shadow: 0 0 0 2px var(--ink); }

  #calendar .month .today { text-decoration: underline; text-underline-offset: 3px; }
  #calendar .key { display: flex; align-items: center; justify-content: flex-end; gap: 0.25rem; margin-top: 0.55rem; font-size: 0.72rem; color: var(--muted); }
  #calendar .key i { width: 0.8rem; height: 0.8rem; border-radius: 3px; }
  #calendar .detail { margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px solid var(--rule); min-height: 5.6rem; font-size: 0.88rem; line-height: 1.4; }
  #calendar .detail b { display: block; font-weight: 600; }
  #calendar .detail small { color: var(--muted); }
  #calendar .detail p { margin: 0.3rem 0 0; color: var(--muted); }
  #calendar .detail p.said { font-family: var(--voice); font-size: 1rem; color: var(--ink); }
  #pick, #search {
    border: 1px solid var(--rule); border-radius: 999px;
    background: transparent; padding: 0.4rem 0.85rem;
  }
  #findbox { position: relative; display: flex; flex: 1 1 6rem; max-width: 13rem; min-width: 0; }
  /* The search box opens quick find; it only shows the words of a full search. */
  #search { flex: 1; width: 100%; min-width: 0; cursor: pointer; text-overflow: ellipsis; caret-color: transparent; }
  #search:placeholder-shown { padding-right: 3rem; }
  #findbox kbd {
    position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); pointer-events: none;
    font: inherit; font-size: 0.75rem; line-height: 1.5; color: var(--muted);
    border: 1px solid var(--rule); border-radius: 5px; padding: 0 0.35rem; white-space: nowrap;
  }
  #search:not(:placeholder-shown) + kbd { display: none; }
  /* Settings is an icon alone, so the row has room for the search box even while paused. */
  header #settings { padding-inline: 0.65rem; }
  #settings .icon { margin: 0; }
  #search::placeholder { color: var(--muted); }

  /* The day as a strip: one mark for every stretch of speech. */
  /* Off the day view there is no day to chart or step through. */
  header.plain #strip, header.plain #hours, header.plain #prev, header.plain #next { display: none; }
  header.plain { padding-bottom: 1rem; }
  /* The day at a glance: how much was said through the day, and the conversations beneath. */
  #strip { position: relative; height: 3.6rem; margin-top: 1rem; cursor: pointer; }
  #strip .tick { position: absolute; top: 0; bottom: 8px; width: 1px; background: var(--rule); }
  #strip .bar {
    position: absolute; bottom: 8px; min-width: 2px; border-radius: 2px 2px 0 0;
    background: var(--accent); opacity: 0.78;
  }
  #strip .talk {
    position: absolute; bottom: 0; height: 4px; min-width: 3px; border-radius: 2px;
    background: var(--accent);
  }
  #strip .talk.loose { background: var(--muted); opacity: 0.55; }
  #strip .pin {
    position: absolute; top: -3px; width: 9px; height: 9px; margin-left: -4.5px; padding: 0; z-index: 2; cursor: pointer;
    border: 1.5px solid var(--paper); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--mark);
  }
  #strip .pin:hover, #strip .pin:focus-visible { background: var(--accent); }
  .card.hot > summary h2 { color: var(--accent); }
  .card.hot > summary .len { background: var(--mark); }
  .part { display: flex; align-items: center; gap: 0.4rem; margin: 1.5rem 0 0.35rem var(--gutter); font-size: 0.85rem; font-weight: 600; color: var(--muted); }
  .tools + .part { margin-top: 0.4rem; }
  #strip.over .bar { opacity: 0.28; }
  #strip.over .bar.hot { opacity: 1; }
  #strip .talk.hot { background: var(--mark); opacity: 1; }
  #head {
    position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px;
    background: var(--mark); box-shadow: 0 0 0 1.5px var(--paper); pointer-events: none;
  }
  #tip {
    position: absolute; bottom: calc(100% + 7px); transform: translateX(-50%); z-index: 4;
    max-width: 24rem; padding: 0.3rem 0.6rem; border-radius: 7px; pointer-events: none;
    background: var(--ink); color: var(--paper); font-size: 0.8rem; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #tip b { font-weight: 600; margin-right: 0.5rem; font-variant-numeric: tabular-nums; }
  #head[hidden], #tip[hidden] { display: none; }
  #hours { position: relative; height: 1.25rem; color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  #hours span { position: absolute; top: 0.3rem; white-space: nowrap; }

  /* Content runs the width of the header above it; lines of text keep their own measure. */
  main { padding: 1.5rem var(--pad) 9rem; max-width: calc(100vw - 2 * var(--shift)); margin-left: var(--shift); }
  .line {
    display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr);
    align-items: baseline;
    width: 100%; padding: 0.3rem 0; margin: 0;
    border: 0; background: none; text-align: left; cursor: pointer;
  }
  .line time {
    color: var(--muted); font-size: 0.82rem;
    font-variant-numeric: tabular-nums;
  }
  .line span {
    font-family: var(--voice); font-size: 1.2rem; line-height: 1.6;
    max-width: 68ch;
    padding: 0 0.3rem; margin-left: -0.3rem; border-radius: 3px;
  }
  .line:hover span { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .line.on span { background: var(--mark); color: var(--mark-ink); }
  /* In a conversation, a speaker's turn is one paragraph; each thing said in it can be played. */
  .turn { display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); align-items: baseline; padding: 0.3rem 0; }
  .turn time { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
  .turn p { margin: 0; max-width: 68ch; font-family: var(--voice); font-size: 1.2rem; line-height: 1.6; }
  .turn.tinted { background: linear-gradient(var(--who), var(--who)) no-repeat calc(var(--gutter) - 0.85rem) 0.45rem / 2px calc(100% - 0.9rem); }
  .say { border-radius: 3px; cursor: pointer; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .say:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .say.mute { cursor: text; }
  .say.mute:hover { background: none; }
  .say.on { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 3px var(--mark); }
  .say.found { box-shadow: 0 0 0 2px var(--accent); }
  .say.on.found { box-shadow: 0 0 0 3px var(--mark), 0 0 0 5px var(--accent); }
  .who { margin: 0.75rem 0 0 var(--gutter); font-size: 0.85rem; min-height: 1.5rem; }
  .who button {
    border: 0; background: none; padding: 0; cursor: pointer;
    font-weight: 600; color: var(--who, var(--accent));
    text-decoration: underline dotted transparent; text-underline-offset: 3px;
  }
  .who button:hover { text-decoration-color: currentColor; }
  .who.unknown { color: var(--muted); }
  .who input {
    border: 1px solid var(--accent); border-radius: 4px; background: transparent;
    padding: 0.1rem 0.4rem; width: 12rem; font-weight: 600;
  }
  .who .here {
    margin-left: 0.5rem; padding: 0.1rem 0.6rem; font-weight: 400; font-size: 0.8rem;
    border: 1px solid var(--rule); border-radius: 999px; color: var(--ink);
  }
  .who small { color: var(--muted); margin-left: 0.6rem; font-size: 0.8rem; }
  .tools {
    display: flex; align-items: center; gap: 1rem;
    margin: 0 0 0.6rem var(--gutter); color: var(--muted); font-size: 0.85rem;
  }
  #all, .copy {
    border: 1px solid var(--rule); border-radius: 999px; background: transparent;
    padding: 0.2rem 0.7rem; cursor: pointer; font-size: 0.85rem;
  }
  #all:hover, .copy:hover { border-color: var(--accent); color: var(--accent); }
  /* Choosing conversations to delete: a tick box before each time, and the row above acts on those ticked. */
  .tools { flex-wrap: wrap; row-gap: 0.5rem; }
  .tools .copy:disabled { opacity: 0.5; cursor: default; border-color: var(--rule); color: inherit; }
  .tools .away:hover:not(:disabled), .tools .danger { border-color: var(--bad); color: var(--bad); }
  .tools .danger:hover:not(:disabled) { background: var(--bad); color: var(--paper); }
  .tools .asking { flex: 1 1 16rem; max-width: 46ch; color: var(--ink); font-size: 0.9rem; line-height: 1.4; }
  .tools .asking.failed { color: var(--bad); }
  .talks.picking { --gutter: 6.4rem; }
  .pick { width: 1rem; height: 1rem; margin: 0 0.6rem 0 0; vertical-align: -0.18rem; accent-color: var(--accent); cursor: pointer; }
  /* The day: conversations on the left, the day at a glance on the right. */
  .daygrid { display: grid; grid-template-columns: minmax(0, 1fr) 21rem; gap: 3.5rem; align-items: start; }
  .daygrid.solo { grid-template-columns: minmax(0, 1fr); }
  .daygrid.solo .glance { display: none; }
  .glance { position: sticky; top: calc(var(--head, 10rem) + 1.5rem); max-height: calc(100vh - var(--head, 10rem) - 4.5rem); overflow-y: auto; padding-bottom: 0.5rem; }
  .glance > section { margin: 0 0 1.6rem; }
  .glance h3 { margin: 0 0 0.4rem; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
  .glance .recap { margin: 0 0 1.6rem; padding: 1rem 1.1rem; max-width: none; }
  .glance .recap .headline { font-size: 1.2rem; }
  .glance .recap ul { font-size: 0.92rem; }
  .recap .kicker { margin: 0 0 0.35rem; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
  /* Beside the day, an open conversation's summary takes the recap's place. Where the
     side column sits above the conversations instead, the summary stays inside its card. */
  @media (min-width: 1101px) {
    .glance.talking > .recap:not(.talk) { display: none; }
  }
  @media (max-width: 1100px) { .glance > .recap.talk { display: none; } }
  .glance ul.plain { list-style: none; margin: 0; padding: 0; }
  .glance ul.plain li { border-top: 1px solid var(--rule); }
  .glance ul.plain .go {
    display: block; width: 100%; padding: 0.5rem 0; border: 0; background: none; text-align: left; cursor: pointer; line-height: 1.4;
  }
  .glance ul.plain .go:hover span { color: var(--accent); }
  .glance ul.plain small { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 0.1rem; }
  .dot { display: inline-block; width: 0.55rem; height: 0.55rem; margin-right: 0.45rem; border-radius: 50%; background: var(--who, var(--muted)); }
  @media (max-width: 1100px) {
    .daygrid { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .glance { position: static; max-height: none; order: -1; margin-bottom: 0.6rem; }
  }
  .scraps { border-top: 1px solid var(--rule); }
  .scraps > summary {
    display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); align-items: baseline;
    padding: 0.5rem 0; cursor: pointer; list-style: none; color: var(--muted); font-size: 0.85rem;
  }
  .scraps > summary::-webkit-details-marker { display: none; }
  .scraps > summary b { font-weight: 500; }
  .scraps > summary small { display: block; font-family: var(--voice); font-style: italic; font-size: 0.9rem; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scraps > summary:hover b { color: var(--accent); }
  .scraps[open] > summary small { display: none; }
  .scraps .card > summary { padding: 0.5rem 0; }
  .when { padding-right: 1.1rem; }
  .len { display: block; height: 3px; margin-top: 0.4rem; border-radius: 2px; background: color-mix(in srgb, var(--accent) 60%, transparent); }
  .len[hidden] { display: none; }
  .card { border-top: 1px solid var(--rule); }
  .card > summary {
    display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); align-items: baseline;
    padding: 0.85rem 0; cursor: pointer; list-style: none;
  }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary time { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
  .card > summary h2 { margin: 0; font-size: 1.35rem; line-height: 1.25; max-width: 68ch; }
  .card > summary h2.untitled { color: var(--muted); font-style: italic; font-size: 1.12rem; }
  .card > summary:hover h2 { color: var(--accent); }
  .card[open] > summary h2 { color: var(--accent); }
  /* Renaming: a pencil beside the title of an open conversation, then the title becomes a field. */
  .card .rename { display: none; margin-left: 0.5rem; padding: 0.15rem; border: 0; border-radius: 4px; background: none; color: var(--muted); cursor: pointer; vertical-align: -0.1rem; }
  .card[open] > summary .rename { display: inline-block; }
  .card .rename:hover, .card .rename:focus-visible { color: var(--accent); }
  .card > summary input.retitle {
    display: block; width: 100%; max-width: 68ch; box-sizing: border-box; margin: -0.2rem 0 0 -0.4rem; padding: 0.1rem 0.35rem;
    border: 1px solid var(--accent); border-radius: 4px; background: transparent; color: var(--ink);
    font-family: var(--voice); font-size: 1.35rem; line-height: 1.25;
  }
  .card .meta { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.85rem; }
  .card .body { padding: 0 0 1.4rem; }
  /* An open conversation keeps its title in view while you read down it. */
  .card[open] > summary { position: sticky; top: var(--head, 10rem); z-index: 1; background: var(--paper); box-shadow: 0 1px 0 var(--rule); }
  /* Above an open conversation: Notes or Transcript, and what can be done with it. */
  .card .viewbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin: 0.4rem 0 0 var(--gutter); }
  .card .seg { display: inline-flex; padding: 3px; border: 1px solid var(--rule); border-radius: 999px; }

<script>
const $ = (id) => document.getElementById(id);
const main = $("main"), strip = $("strip"), audio = $("audio");
const QUIET_MS = 120000;
// The Limitless service ends on this day; advice about its app and exports stops applying then.
const LIMITLESS_ENDED = Date.now() >= new Date(2026, 11, 1).getTime();
const clock = new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit" });
const clockSec = new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
const longDay = new Intl.DateTimeFormat([], { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const thisYearDay = new Intl.DateTimeFormat([], { weekday: "long", day: "numeric", month: "long" });

let days = [];        // [{day, lines}] for days that have speech
let day = null;       // "YYYY-MM-DD" being shown
let lines = [];       // utterances of that day
let playing = null;   // utterance being played
let wanted = null;    // { line, talk }: what to reveal after loading a day
let searching = false;
let talks = [];       // summarised conversations of the day
let reminding = false;
let peopling = false;   // the People page is showing
let configuring = false;
let asking = false;
let chat = [];        // the Ask thread: [{ role, content, lines }]
let chatId = null;    // its saved id, once the first question has been answered
let threads = [];     // saved threads: [{ id, title, updated, questions }]
let chatBusy = false;
let groups = [];              // the day's conversation cards
const openCards = new Set();  // cards the reader has opened, kept across refreshes
/* Choosing several conversations to delete at once: the day they are chosen on, the keys of
   those ticked, and what to redraw when a tick changes. Null when not choosing. */
let picking = null;  // { day, keys: Set, watch: [fn], trouble: "" }
const tickChanged = () => { if (picking) { picking.trouble = ""; picking.watch.forEach((redraw) => redraw()); } };
const TALK_GAP_MS = 300000;   // a silence this long separates unsummarised conversations

const pad = (n) => String(n).padStart(2, "0");
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayStart = (key) => { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    // Names for assistive tech go in as attributes: older browsers ignore them as properties.
    if (key === "role") n.setAttribute("role", value);
    else if (key.startsWith("aria")) n.setAttribute(`aria-${key.slice(4).toLowerCase()}`, value);
    else n[key] = value;
  }
  n.append(...kids);
  return n;
};

/* Icons: 24-unit line drawings that take the colour of the text around them. */
const ICONS = {

  photo: "M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z M12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z",

  calendar: "M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z M4 10h16 M8 3v4 M16 3v4",
  unlink: "M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1 M4 4l16 16",
};
const SVG = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs = {}) {
  const node = document.createElementNS(SVG, tag);
  for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
  return node;
}
function icon(name, size = 18) {
  const svg = svgEl("svg", { viewBox: "0 0 24 24", width: size, height: size, fill: "none", stroke: "currentColor",
    "stroke-width": 1.7, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true", class: "icon" });
  if (ICONS[name]) svg.append(svgEl("path", { d: ICONS[name] }));
  return svg;
}
/* The Limitful asterisk, as the answering voice in Ask. */
function star(size) {
  const svg = svgEl("svg", { viewBox: "-42 -42 84 84", width: size, height: size, "aria-hidden": "true", class: "star" });
  for (let i = 0; i < 6; i++) {
    svg.append(svgEl("path", { d: "M-2.6 0L-6.4 -33.6A6.4 6.4 0 0 1 6.4 -33.6L2.6 0Z", fill: "var(--mark)", transform: `rotate(${i * 60})` }));
  }
  svg.append(svgEl("circle", { r: 4.2, fill: "var(--mark)" }));
  return svg;
}
/* A heading or button label with its icon in front. */
const withIcon = (name, text, size) => [icon(name, size), el("span", { textContent: text })];

async function get(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function quietFor(ms) {
  const min = Math.round(ms / 60000);
  if (min < 60) return `quiet for ${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return `quiet for ${h} h${m ? ` ${m} min` : ""}`;
}

function lineButton(u, showDay) {
  const t = new Date(u.start);
  const b = el("button", { className: "line", id: `u${u.id}`, title: clockSec.format(t) },
    el("time", { dateTime: t.toISOString(), textContent: clock.format(t) }),
    el("span", { textContent: u.text }));
  b.addEventListener("click", () => openDay(showDay, u.id));
  return b;
}

async function post(url, body) {
  const res = await fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

/* First run: a guide from an empty folder to a Lifelog with something in it. */
let welcoming = false;
let welcomeTimer = null;  // while the guide follows a background job
/* The Limitful wordmark at a given height, in the page's own ink. */
function wordmark(height) {
  const holder = document.createElement("div");
  holder.innerHTML = `<svg class="wordmark" viewBox="4 8 624 124" height="${height}" role="img" aria-label="Limitful"><use href="#wordmark"/></svg>`;
  return holder.firstChild;
}

function leaveWelcome() {
  welcoming = false;
  if (welcomeTimer) { clearInterval(welcomeTimer); welcomeTimer = null; }
}
const welcomed = () => { try { return localStorage.getItem("limitful-welcomed") === "1"; } catch { return false; } };
const setWelcomed = () => { try { localStorage.setItem("limitful-welcomed", "1"); } catch { /* private window */ } };

/* The pendant, front on: clip, microphone holes, side button and its light. */
function pendantDrawing(width = 108) {
  const glow = svgEl("circle", { cx: 60, cy: 86, r: 2.7, fill: "#ffffff" });
  const halo = svgEl("circle", { cx: 60, cy: 86, r: 10, fill: "#ffffff" });
  const holes = (d) => svgEl("path", { d, fill: "none", stroke: "#131517", "stroke-width": 1.7,
    "stroke-linecap": "round", "stroke-dasharray": "0.01 3.4" });
  const node = svgEl("svg", { viewBox: "0 0 120 136", width, height: Math.round(width * 136 / 120), role: "img", "aria-label": "The pendant" });
  node.append(
    svgEl("path", { d: "M34 60V28a22 22 0 0 1 22-22h8a22 22 0 0 1 22 22v32Z", fill: "#3c4044" }),       // clip
    svgEl("rect", { x: 104, y: 79, width: 5, height: 20, rx: 2.5, fill: "#1b1d1f" }),                    // side button
    svgEl("circle", { cx: 60, cy: 86, r: 47, fill: "#26292c" }),                                         // body
    svgEl("circle", { cx: 60, cy: 86, r: 43.5, fill: "#3a3e42" }),                                       // face
    holes("M28.7 71.4A34.5 34.5 0 0 1 91.3 71.4"),
    holes("M31.9 72.9A31 31 0 0 1 88.1 72.9"),
    holes("M35.1 74.4A27.5 27.5 0 0 1 84.9 74.4"),
    halo, glow);
  return { node, glow, halo };
}

async function showWelcome(step = "start", fromSettings = false) {
  leaveWelcome();
  welcoming = true;
  searching = reminding = peopling = configuring = asking = false;
  document.querySelector("header").classList.add("plain");
  for (const id of ["ask", "remind", "settings"]) $(id).setAttribute("aria-pressed", "false");
  visit("#welcome");
  $("title").textContent = "Welcome";
  strip.replaceChildren();
  say("");

  const ROUTE = ["before", "connect", "sync", "summaries"];  // the numbered steps of the pendant path
  const button = (label, onClick, kind = "") => {
    const b = el("button", { className: `pill ${kind}`, textContent: label });
    b.addEventListener("click", onClick);
    return b;
  };
  const FIRST = "Keep your pendant working";
  const page = (stage, title, ...children) => {
    const at = ROUTE.indexOf(stage);
    const head = at < 0 ? [] : [
      el("div", { className: "progress", ariaHidden: "true" },
        ...ROUTE.map((_, n) => el("i", { className: n <= at ? "done" : "" }))),
      el("p", { className: "where", textContent: `Step ${at + 1} of ${ROUTE.length}` })];
    // The first screen carries the name; the steps after it carry their progress.
    main.replaceChildren(el("div", { className: "welcome" }, ...(title === FIRST ? [wordmark(46)] : head), el("h2", { textContent: title }), ...children));
    const heading = main.querySelector("h2");
    heading.tabIndex = -1;
    heading.scrollIntoView({ block: "nearest" });
    heading.focus({ preventScroll: true });  // the button just clicked is gone; start reading from the new step
  };
  const trouble = (message, advice) => el("div", { className: "trouble", role: "alert" },
    el("p", { textContent: message.endsWith(".") ? message : `${message}.` }),
    ...(advice ? [el("p", { className: "advice", textContent: advice })] : []));
  // Poll the server's job until it stops; `each` sees every reading.
  const follow = (each) => new Promise((resolve) => {
    const tick = async () => {
      let job;
      try { job = await get("/api/status"); } catch { return; }
      if (!welcoming) return;
      each(job);
      if (!job.running) { clearInterval(welcomeTimer); welcomeTimer = null; resolve(job); }
    };
    welcomeTimer = setInterval(tick, 1500);
    tick();
  });
  const finish = async (fullestDay = false) => {
    setWelcomed();
    try { days = await get("/api/days"); } catch { /* keep what we had */ }
    countReminders();
    watchJob();  // summarising or speaker linking may still be running
    const busiest = fullestDay && days.length ? days.reduce((a, b) => (b.lines > a.lines ? b : a)) : null;
    openDay(busiest ? busiest.day : days.length ? days[days.length - 1].day : dayKey(new Date()));
  };
  let state = { empty: true, demo: false, model_ready: true, provider: null };
  try { state = await get("/api/welcome"); } catch { /* assume a fresh start */ }
  if (!welcoming) return;

  const way = (pic, title, about, go) => {
    const b = el("button", { className: "way" }, icon(pic, 26), el("span", {}, el("b", { textContent: title }), el("small", { textContent: about })));
    b.addEventListener("click", go);
    return b;
  };

  const backToSettings = () => { settingsPane = "pendant"; showSettings(); };

  const steps = {
    start() {
      const note = el("p", { className: "small" });
      page("", FIRST,
        el("p", { className: "lede", textContent: "Limitful takes recordings off your Limitless Pendant, turns them into text on this computer, and keeps them here to read, search and ask about. No Limitless account is involved. Where would you like to start?" }),
        way("pendant", "Connect my pendant", "Pair it with this computer and bring in what it has recorded. Allow ten minutes the first time, mostly for a download.", () => steps.before()),
        way("import", "Import my Limitless history", "Bring in a data export from Limitless: transcripts, audio and reminders.", () => steps.history()),
        way("day", "Look around first", "Fill the Lifelog with made-up conversations. You can remove them with one click.", async () => {
          note.textContent = "Writing the made-up conversations…";
          try { await post("/api/demo", { action: "load" }); await showDemoBar(); await finish(true); }
          catch (err) { note.textContent = `Could not load them. ${err.message}`; }
        }),
        note,
        el("p", { className: "small" }, button("Skip, and open the Lifelog", () => finish(), "plain")));
    },

    before() {
      const item = (lead, rest) => el("li", {}, el("b", { textContent: lead }), " ", rest);
      page("before", "Before you connect",
        el("ol", { className: "prep" },
          ...(LIMITLESS_ENDED ? [] : [item("Let the Limitless app sync one last time.", "Pairing the usual way resets the pendant, and that erases any audio it has not handed over yet. Skip this if you no longer use the app, or if you have the pendant's USB cable: with it you can pair and keep the audio.")]),
          ...(LIMITLESS_ENDED ? [] : [item("Ask Limitless for your data export.", "The service ends on December 1, 2026 and its copy of your history goes with it. You can import the export here whenever it arrives.")]),
          item("Turn off Bluetooth on your phone.", "The pendant talks to one device at a time, and the phone usually gets there first. Quitting the Limitless app also works.")),
        el("p", { className: "small", textContent: "Your computer may ask whether this program can use Bluetooth. Allow it." }),
        el("div", { className: "row" }, button("I've done these", () => steps.connect(), "main"), button("Back", () => steps.start())));
    },

    async connect() {
      const status = el("p", { className: "lede", textContent: "This takes a few seconds over Bluetooth." });
      const actions = el("div", { className: "row" });
      page("connect", "Looking for your pendant…", status, actions);
      const title = main.querySelector("h2");
      let p;
      try { p = await post("/api/pendant", { action: "check" }); }
      catch (err) { p = { error: err.message }; }
      if (!welcoming || !title.isConnected) return;
      if (!p.error) {
        title.textContent = "Found it";
        const waiting = p.minutes_waiting < 1 ? "nothing waiting to sync" : `about ${lengthOf(p.minutes_waiting * 60000)} of audio waiting`;
        status.textContent = `Your pendant is already paired with this computer. Battery ${p.battery}%, ${waiting}.`;
        actions.append(button("Continue", () => steps.sync(), "main"));
        return;
      }
      if (/not paired/.test(p.error)) {
        title.textContent = "Found it, not yet paired";
        status.textContent = "The pendant is nearby but has not been paired with this computer.";
        actions.append(button("Pair it", () => steps.pair(), "main"), button("Back", () => steps.before()));
        return;
      }
      title.textContent = "Could not find your pendant";
      status.replaceWith(trouble(p.error, p.advice));
      actions.append(button("Look again", () => steps.connect(), "main"), button("Pair it anyway", () => steps.pair()), button("Back", () => steps.before()));
    },

    pair() {
      page("connect", "Pair your pendant",
        el("p", { className: "lede", textContent: "The pendant only accepts a new computer once it has forgotten the old one. There are two ways to get there." }),
        way("plug", "Keep its recordings", "Plug the pendant in with its USB cable and it is told to forget its old computer. Nothing on it is erased.", () => steps.keep()),
        way("pendant", "Reset the pendant", "No cable needed. A button press puts it in pairing mode, which erases any audio it has not synced yet.", () => steps.reset()),
        el("div", { className: "row" }, button("Back", () => steps.before())));
    },

    keep() {
      const plugged = el("span", { className: "plug", textContent: "Looking for it…" });
      const status = el("p", { className: "status", role: "status" });
      const forget = button("Forget the old computer", async () => {
        forget.disabled = true;
        status.replaceChildren("Telling the pendant to forget…");
        try { await post("/api/pendant", { action: "forget" }); }
        catch (err) { status.replaceChildren(trouble(err.message)); forget.disabled = false; return; }
        watching = false;
        status.textContent = "The pendant has forgotten its old computer and kept its recordings. Do step 3 if it applies, then pair.";
        forget.replaceWith(start);
        start.focus();
      }, "main");
      forget.disabled = true;
      const start = button("Pair", async () => {
        start.disabled = true;
        status.replaceChildren("Waiting for the pendant. Accept the connection request when your computer shows it.");
        try { await post("/api/pendant", { action: "pair" }); }
        catch (err) { status.replaceChildren(trouble(err.message)); start.disabled = false; return; }
        const job = await follow(() => {});
        if (job.error) {
          status.replaceChildren(trouble(job.error, "If this computer was paired with the pendant before, remove Pendant under Bluetooth in System Settings, turn Bluetooth off and on, and try again."));
          start.textContent = "Try again";
          start.disabled = false;
          return;
        }
        status.textContent = "Paired. The pendant accepted this computer and still has its recordings.";
        start.replaceWith(fromSettings ? button("Back to Settings", backToSettings, "main") : button("Continue", () => steps.sync(), "main"));
      }, "main");
      page(fromSettings ? "" : "connect", "Pair and keep the recordings",
        el("ol", { className: "prep" },
          el("li", {}, "Plug the pendant into this computer with its USB cable. ", plugged),
          el("li", { textContent: "Click Forget the old computer. The pendant drops every computer and phone it was paired with, and keeps its recordings." }),
          el("li", { textContent: "If this computer was paired with the pendant before, remove Pendant under Bluetooth in System Settings, then turn Bluetooth off and on. Otherwise the computer keeps trying its old key." }),
          el("li", { textContent: "Click Pair and accept the connection request. There is no button to press on the pendant." })),
        el("p", { className: "small", textContent: "The Limitless app will stop seeing the pendant until it is paired there again." }),
        status,
        el("div", { className: "row" }, forget, ...(fromSettings ? [button("Back to Settings", backToSettings)] : [button("Reset it instead", () => steps.reset()), button("Back", () => steps.pair())])));
      // Watch for the cable until the pendant shows up.
      let watching = true;
      const look = async () => {
        if (!watching || !welcoming || !plugged.isConnected) return;
        let seen = false;
        try { const p = await post("/api/pendant", { action: "usb" }); seen = Boolean(p.usb && !p.usb.error); } catch { /* look again */ }
        if (!watching || !plugged.isConnected) return;
        if (seen) {
          plugged.textContent = "Plugged in";
          plugged.className = "plug yes";
          forget.disabled = false;
          return;
        }
        plugged.textContent = "Not plugged in yet";
        setTimeout(look, 2500);
      };
      look();
    },

    reset() {
      const { node, glow, halo } = pendantDrawing(150);
      const light = (colour, pulsing) => {
        glow.setAttribute("fill", colour);
        halo.setAttribute("fill", colour);
        halo.setAttribute("opacity", colour === "#ffffff" ? 0.1 : 0.35);
        node.classList.toggle("pulsing", Boolean(pulsing));
      };
      light("#ffffff");
      const status = el("p", { className: "status", role: "status" });
      const start = button("Start pairing", async () => {
        start.disabled = true;
        status.replaceChildren("Waiting for the pendant. Do the button press now.");
        light("#b48cff", true);
        try { await post("/api/pendant", { action: "pair" }); }
        catch (err) { status.replaceChildren(trouble(err.message)); light("#ffffff"); start.disabled = false; return; }
        const began = Date.now();
        const job = await follow((j) => {
          const left = Math.max(0, 180 - Math.round((Date.now() - began) / 1000));
          if (j.running) status.textContent = `Waiting for the pendant. Do the button press now. ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")} left.`;
        });
        if (job.error) {
          light("#ffffff");
          status.replaceChildren(trouble(job.error, job.advice));
          start.textContent = "Try again";
          start.disabled = false;
          return;
        }
        light("#3d8bff");
        status.textContent = "Paired. The pendant accepted this computer.";
        start.replaceWith(button("Continue", () => steps.sync(), "main"));
      }, "main");
      page("connect", "Pair your pendant",
        el("div", { className: "pairing" }, node,
          el("ol", { className: "prep" },
            el("li", { textContent: "Click Start pairing. It waits three minutes." }),
            el("li", { textContent: "On the pendant, press the side button once and let go, then straight away press and hold it." }),
            el("li", { textContent: "A purple light comes on. Keep holding until it goes out, then let go." }),
            el("li", { textContent: "A blue light means it is ready. Accept the connection request your computer shows." }))),
        el("p", { className: "hold", textContent: "This resets the pendant. Any audio it has not synced yet is erased." }),
        status,
        el("div", { className: "row" }, start, button("Back", () => steps.pair())));
    },

    sync() {
      const status = el("p", { className: "status", role: "status" });
      const bar = el("i");
      const meter = el("div", { className: "meter wide", hidden: true }, bar);
      const skip = button("Skip for now", () => steps.summaries());
      const start = button("Sync now", async () => {
        start.disabled = true;
        skip.hidden = true;
        status.replaceChildren("Syncing the pendant…");
        try { await post("/api/pendant", { action: "sync" }); }
        catch (err) { status.replaceChildren(trouble(err.message)); start.disabled = false; skip.hidden = false; return; }
        const job = await follow((j) => {
          if (!j.running) return;
          meter.hidden = !j.total;
          bar.style.width = j.total ? `${Math.min(100, 100 * j.done / j.total)}%` : "0";
          status.textContent = j.total ? `${j.what}: ${j.done.toLocaleString()} of ${j.total.toLocaleString()}` : `${j.what}…`;
        });
        meter.hidden = true;
        skip.hidden = false;
        if (job.error) {
          status.replaceChildren(trouble(job.error, job.advice));
          start.textContent = "Try again";
          start.disabled = false;
          return;
        }
        status.textContent = job.note || "Synced.";
        start.replaceWith(button("Continue", () => steps.summaries(), "main"));
        skip.remove();
      }, "main");
      page("sync", "Bring in what it has recorded",
        el("p", { className: "lede", textContent: "This downloads the audio, frees that space on the pendant, and turns the speech into text on this computer." }),
        ...(state.model_ready ? [] : [el("p", { className: "small", textContent: "The first time, a 1.6 GB speech model is downloaded. Text appears once it has arrived, and nothing has stalled while the numbers are moving." })]),
        status, meter,
        el("div", { className: "row" }, start, skip));
    },

    summaries() {
      const key = el("input", { type: "password", autocomplete: "off", spellcheck: false, placeholder: "sk-ant-…", id: "wkey" });
      const keyBox = el("div", { className: "key", hidden: true }, el("label", { htmlFor: "wkey", textContent: "Anthropic API key" }), key,
        el("small", { textContent: "Optional if you are signed in with the Anthropic command-line tool. Kept on this computer and sent only to Anthropic." }));
      const pick = (value, title, about) => el("label", { className: "choice" },
        el("input", { type: "radio", name: "wprovider", value, checked: (state.provider || "") === value }),
        el("b", { textContent: title }), el("span", { textContent: about }));
      const options = el("fieldset", {},
        el("legend", { className: "unseen", textContent: "What writes summaries" }),
        pick("", "Off", "Conversations keep their opening words as a title. You can choose later under Settings."),
        pick("claude", "Claude", "Best results. The text of each conversation is sent to Anthropic and billed to your Anthropic account."),
        keyBox,
        pick("ollama", "Ollama", "A model running on this computer, so nothing leaves it. Weaker, and Ollama must be running."));
      const picked = () => options.querySelector("input:checked")?.value ?? "";
      const showKey = () => { keyBox.hidden = picked() !== "claude"; };
      options.addEventListener("change", showKey);
      const status = el("p", { className: "status", role: "status" });
      const save = button("Save and continue", async () => {
        save.disabled = true;
        status.replaceChildren(picked() === "claude" ? "Checking with Anthropic…" : "Saving…");
        const body = { provider: picked() };
        if (key.value.trim()) body.api_key = key.value.trim();
        try { await post("/api/settings", body); }
        catch (err) { status.replaceChildren(trouble(err.message)); save.disabled = false; return; }
        if (picked()) { try { await post("/api/digest", {}); } catch { /* nothing to summarise yet, or busy */ } }
        steps.done(Boolean(picked()));
      }, "main");
      page("summaries", "Titles, summaries and reminders",
        el("p", { className: "lede", textContent: "A language model can give each conversation a title and a short summary, write a recap of each day, and pick out things someone said they would do. Transcription does not need it." }),
        options, status,
        el("div", { className: "row" }, save, button("Skip", () => steps.done(false))));
      showKey();
    },

    async done(summarising) {
      try { days = await get("/api/days"); } catch { /* keep what we had */ }
      const have = days.length
        ? `Your Lifelog has ${days.length} day${days.length === 1 ? "" : "s"} in it.`
        : "Nothing has been recorded yet, so the Lifelog is empty for now. Wear the pendant, then sync.";
      page("", "You're set",
        el("p", { className: "lede", textContent: `${have}${summarising ? " Summaries are being written in the background and appear as they finish." : ""}` }),
        autostartSwitch(),
        el("ul", { className: "prep" },
          el("li", {}, el("b", { textContent: "To name people, " }), "click a speaker's name in a conversation that has them (imported ones do)."),
          el("li", {}, el("b", { textContent: "To run this guide again, " }), "open Settings and choose Set up again.")),
        el("div", { className: "row" }, button("Open your Lifelog", () => finish(), "main")));
    },

    history() {
      const status = el("p", { className: "status", role: "status" });
      const file = el("input", { type: "file", accept: ".zip,application/zip", hidden: true });
      const choose = button("Choose an export zip", () => file.click(), "main");
      file.addEventListener("change", async () => {
        const chosen = file.files[0];
        file.value = "";
        if (!chosen) return;
        choose.disabled = true;
        status.replaceChildren(`Importing ${chosen.name}. Large exports take a minute; keep this page open.`);
        try {
          const res = await fetch("/api/import", { method: "POST", headers: { "Content-Type": "application/zip" }, body: chosen });
          if (!res.ok) throw new Error(await res.text());
          const r = await res.json();
          status.textContent = r.conversations
            ? imported(r)
            : "Nothing new in that export.";
          choose.replaceWith(button("Continue", () => steps.done(false), "main"));
        } catch (err) {
          status.replaceChildren(trouble(`Import failed. ${sentence(err.message)}`));
          choose.disabled = false;
        }
      });
      page("", "Import your Limitless history",
        el("p", { className: "lede", textContent: (LIMITLESS_ENDED ? "A data export from Limitless is a .zip file." : "Request a data export from Limitless before the service ends on December 1, 2026. It arrives as a .zip file.") + " Choose it here to bring in your conversations, transcripts, audio and reminders." }),
        el("p", { className: "small", textContent: "The file stays on this computer. You can import more exports later under Settings, and connect a pendant from there too." }),
        status, file,
        el("div", { className: "row" }, choose, button("Back", () => steps.start())));
    },
  };
  (steps[step] || steps.start)();
}

/* Settings, Import: bringing in Voice Memos from this Mac, and the list of recordings that
   were added, each of which can be given the right time or removed. Fills itself in once loaded. */
/* Calendars read from private ICS addresses. The address is typed once and never shown again:
   the server answers with each calendar's name, a hint of its address and how its last read went. */
function calendarsPanel(first, changed) {
  const node = el("div", {});
  const problem = el("p", { className: "note", role: "status" });
  const tell = (text, failed) => { problem.textContent = text; problem.classList.toggle("failed", Boolean(failed)); };
  const act = async (body, busy, doing) => {
    const was = busy.textContent;
    busy.disabled = true; busy.textContent = doing; tell("");
    try { const list = await post("/api/calendars", body); draw(list); changed(list); return list; }
    catch (err) { tell(sentence(err.message), true); return null; }
    finally { busy.disabled = false; busy.textContent = was; }
  };
  const name = el("input", { type: "text", id: "calName", placeholder: "Personal", autocomplete: "off" });
  const url = el("input", { type: "password", id: "calUrl", placeholder: "https://calendar.google.com/calendar/ical/…/basic.ics",
    autocomplete: "off", spellcheck: false });
  const add = el("button", { className: "pill main", textContent: "Add calendar" });
  add.addEventListener("click", async () => {
    const list = await act({ action: "add", name: name.value, url: url.value }, add, "Reading it…");
    if (!list) return;
    const added = list.find((c) => c.name === name.value.trim().replace(/\s+/g, " "));
    if (added?.error) tell(`Saved, but it could not be read: ${added.error}`, true);
    else tell(`Added ${added ? added.name : "it"}: ${count(added ? added.events : 0, "event")}.`);
    name.value = ""; url.value = "";
  });
  const readNow = el("button", { className: "pill", textContent: "Read all now" });
  readNow.addEventListener("click", () => act({ action: "read" }, readNow, "Reading…"));
  const list = el("ul", { className: "cals" });
  function draw(cals) {
    readNow.hidden = !cals.length;
    list.replaceChildren(...cals.map((c) => {
      const remove = el("button", { className: "pill danger", textContent: "Remove" });
      remove.addEventListener("click", () => {
        if (!remove.dataset.sure) { remove.dataset.sure = "1"; remove.textContent = "Remove it and its events"; return; }
        act({ action: "remove", name: c.name }, remove, "Removing…");
      });
      remove.addEventListener("blur", () => { delete remove.dataset.sure; remove.textContent = "Remove"; });
      const state = c.error ? el("small", { className: "failed", textContent: `Last read failed: ${c.error}` })
        : el("small", { textContent: `${count(c.events, "event")}` + (c.read_ms ? `, read ${clock.format(new Date(c.read_ms))}` : "") + ` · ${c.hint}` });
      return el("li", {}, icon("calendar", 18), el("span", {}, el("b", { textContent: c.name }), state), remove);
    }));
    if (!cals.length) list.append(el("li", {}, el("span", { className: "small", textContent: "No calendars yet." })));
  }
  draw(first);
  node.append(
    el("h2", {}, ...withIcon("calendar", "Calendars", 22)),
    el("p", { textContent: "Limitful reads your calendars, never changes them, and reads them again every 6 hours. Each day in your lifelog then lists its events and shows them on its timeline, each conversation says which meeting it happened in, and Claude sees who was invited when it titles conversations. Event descriptions are not kept, since they often hold meeting passcodes." }),
    list,
    el("div", { className: "row" }, readNow),
    el("h2", {}, ...withIcon("plus", "Add a calendar", 22)),
    el("ol", { className: "small steps" },
      el("li", { textContent: "Google: open Google Calendar on the web, then Settings. Under Settings for my calendars, click the calendar, and copy Secret address in iCal format." }),
      el("li", { textContent: "Outlook or Office 365: in Outlook on the web, Settings, Calendar, Shared calendars, Publish a calendar, then copy the ICS link. Some organizations turn this off." })),
    el("div", { className: "key flat" },
      el("label", { htmlFor: "calName", textContent: "Name" }), name,
      el("label", { htmlFor: "calUrl", textContent: "Private address" }), url,
      el("small", { textContent: "The address works like a password for that calendar. It is kept only on this computer and never shown again. If it leaks, reset it in the calendar's settings, remove the calendar here, and add the new address." })),
    el("div", { className: "row" }, add),
    problem);
  return node;
}

/* Places: where you were, from your phone. Coordinates stay on this computer; the lifelog
   only gets the names given here. Spots where you spend time are offered to be named. */
function placesPanel(first, changed) {
  const node = el("div", {});
  const problem = el("p", { className: "note", role: "status" });
  const tell = (text, failed) => { problem.textContent = text; problem.classList.toggle("failed", Boolean(failed)); };
  let state = first;
  const act = async (body, busy, doing) => {
    const was = busy.textContent;
    busy.disabled = true; busy.textContent = doing; tell("");
    try { state = await post("/api/places", body); draw(); changed(state); return state; }
    catch (err) { tell(sentence(err.message), true); return null; }
    finally { busy.disabled = false; busy.textContent = was; }
  };
  const named = el("ul", { className: "cals" });
  const offered = el("ul", { className: "cals" });
  const offeredBox = el("div", {}, el("h3", { textContent: "Name the places you spend time" }),
    el("p", { className: "small", textContent: "These spots have no name yet. Give each one a name, or leave it: unnamed spots show as Elsewhere." }), offered);
  const data = el("p", { className: "small" });
  const folderNow = el("p", { className: "small" });
  const mapLink = (lat, lon) => el("a", { href: `https://www.google.com/maps?q=${lat},${lon}`, target: "_blank", rel: "noopener", textContent: "see on map" });
  function draw() {
    named.replaceChildren(...state.places.map((p) => {
      const remove = el("button", { className: "pill danger", textContent: "Remove" });
      remove.addEventListener("click", () => act({ action: "remove", name: p.name }, remove, "Removing…"));
      return el("li", {}, icon("pin", 18), el("span", {}, el("b", { textContent: p.name }),
        el("small", {}, `within ${Math.round(p.radius_m)} m · `, mapLink(p.lat, p.lon))), remove);
    }));
    if (!state.places.length) named.append(el("li", {}, el("span", { className: "small", textContent: "No places named yet." })));
    offered.replaceChildren(...state.suggestions.map((g, i) => {
      const name = el("input", { type: "text", id: `placeOffer${i}`, value: g.guess || "", placeholder: "Name, such as Office", autocomplete: "off" });
      const save = el("button", { className: "pill main", textContent: "Save" });
      save.addEventListener("click", () => act({ action: "add", name: name.value, lat: g.lat, lon: g.lon }, save, "Saving…"));
      name.addEventListener("keydown", (e) => { if (e.key === "Enter") save.click(); });
      return el("li", {}, icon("pin", 18), el("span", {},
        el("small", {}, `About ${g.hours.toLocaleString()} hours here, last on ${shortDay.format(new Date(g.last_ms))}${g.guess ? `. Google calls it ${g.guess}` : ""} · `, mapLink(g.lat, g.lon)),
        name), save);
    }));
    offeredBox.hidden = !state.suggestions.length;
    data.textContent = state.points || state.stays
      ? `Kept on this computer: ${count(state.points, "point")} and ${count(state.stays, "stay")} from ${shortDay.format(new Date(state.first_ms))} to ${shortDay.format(new Date(state.last_ms))}.`
      : "No location data yet.";
    forget.hidden = !(state.points || state.stays);
    folder.value = state.folder || "";
    const file = state.files[0];
    folderNow.textContent = !state.folder ? "No folder chosen yet."
      : state.folder_missing ? "That folder cannot be found. Is Google Drive running?"
      : `Read every 10 minutes.` + (state.logger_last_ms ? ` The phone last reported ${shortDay.format(new Date(state.logger_last_ms))}, ${clock.format(new Date(state.logger_last_ms))}.` : " Nothing from the phone yet.")
        + (file?.error ? ` ${file.name} could not be read: ${file.error}` : "");
  }
  const where = el("input", { type: "text", id: "placeWhere", placeholder: "35.2271, -80.8431", autocomplete: "off" });
  const name = el("input", { type: "text", id: "placeName", placeholder: "Office", autocomplete: "off" });
  const add = el("button", { className: "pill main", textContent: "Add place" });
  add.addEventListener("click", async () => {
    if (await act({ action: "add", name: name.value, where: where.value }, add, "Adding…")) { tell(`Added ${name.value.trim()}.`); name.value = ""; where.value = ""; }
  });
  const folder = el("input", { type: "text", id: "placeFolder", placeholder: "G:\\My Drive\\Lifelog Location", autocomplete: "off", spellcheck: false });
  const useFolder = el("button", { className: "pill main", textContent: "Use this folder" });
  useFolder.addEventListener("click", () => act({ action: "folder", folder: folder.value }, useFolder, "Reading it…"));
  const readNow = el("button", { className: "pill", textContent: "Read now" });
  readNow.addEventListener("click", () => act({ action: "read" }, readNow, "Reading…"));
  const file = el("input", { type: "file", accept: ".json,.gpx,.csv", hidden: true });
  const choose = el("button", { className: "pill" }, ...withIcon("import", "Choose a Timeline export", 16));
  choose.addEventListener("click", () => file.click());
  file.addEventListener("change", async () => {
    const picked = file.files[0];
    file.value = "";
    if (!picked) return;
    choose.disabled = true; tell(`Reading ${picked.name}…`);
    try {
      const res = await fetch("/api/places/import", { method: "POST", body: picked, headers: {
        "Content-Type": "application/octet-stream", "X-Name": encodeURIComponent(picked.name) } });
      if (!res.ok) throw new Error(await res.text());
      state = await res.json(); draw(); changed(state);

function recordingsPanel() {
  const node = el("div", { className: "panel" });
  const stamp = (ms) => { const d = new Date(ms), p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
  const long = (ms) => ms < 60000 ? `${Math.max(1, Math.round(ms / 1000))} s` : ms < 3600000 ? `${Math.round(ms / 60000)} min` : `${Math.floor(ms / 3600000)} h ${Math.round(ms % 3600000 / 60000)} min`;
  const act = async (url, body, problem) => {
    try { draw(await post(url, body)); return true; } catch (err) { problem.textContent = sentence(err.message); problem.classList.add("failed"); return false; }
  };
  const twice = (label, sure, run) => {  // a button that asks once more before doing something that cannot be undone
    const b = el("button", { className: "pill danger busy-off", textContent: label });
    b.addEventListener("click", () => { if (b.dataset.sure) run(b); else { b.dataset.sure = "1"; b.textContent = sure; } });
    b.addEventListener("blur", () => { delete b.dataset.sure; b.textContent = label; });
    return b;
  };
  function draw(r) {
    const vm = r.voice_memos, parts = [];
    if (vm.state !== "unsupported") {
      const problem = el("p", { className: "note" });
      const box = el("input", { type: "checkbox", checked: vm.enabled });
      const about = vm.enabled && vm.since
        ? `Memos recorded since ${shortDay.format(new Date(vm.since))}, ${clock.format(new Date(vm.since))} are added at each sync, filed at the time they were recorded, and transcribed.`
        : vm.enabled ? "Every memo is added at each sync, filed at the time it was recorded, and transcribed."
        : "Memos you record from now on are added at each sync, filed at the time they were recorded, and transcribed like the pendant's audio.";
      box.addEventListener("change", () => act("/api/voicememos", { enabled: box.checked }, problem));
      parts.push(el("h2", {}, ...withIcon("import", "Voice Memos on this Mac", 22)),
        el("p", { textContent: "Reads the Voice Memos this Mac keeps in step with your iPhone through iCloud. Nothing is fetched from Apple, and the Voice Memos library is never changed." }),
        el("label", { className: "switch" }, box, el("span", {}, el("b", { textContent: "Bring in Voice Memos" }), el("small", { textContent: about }))));
      if (vm.state === "denied") {
        parts.push(el("p", { className: "note failed", textContent: "macOS is not letting Limitful read your Voice Memos yet." }),
          el("p", { className: "note", textContent: "Open System Settings, Privacy & Security, Full Disk Access. Press +, then ⇧⌘G, paste the path below and switch it on. Then quit and reopen Limitful. This lets that program read any file you can, so only do it if you are comfortable with that." }),
          el("code", { className: "path", textContent: vm.program }));
      } else if (vm.state === "missing") {
        parts.push(el("p", { className: "note", textContent: "No Voice Memos library was found on this Mac. Open the Voice Memos app once, and turn on Voice Memos under System Settings, your name, iCloud." }));
      } else {
        const row = el("div", { className: "row", style: "margin-top: 0.8rem" });
        const check = el("button", { className: "pill busy-off" }, ...withIcon("refresh", "Check now", 16));
        check.addEventListener("click", async () => { try { await post("/api/voicememos/sync", {}); watchJob(); } catch (err) { problem.textContent = sentence(err.message); } });
        if (vm.enabled) row.append(check);
        // Offered only while some memos are not here: all of them the first time, the rest after that.
        const rest = vm.waiting ?? vm.memos, some = rest < vm.memos;
        if (rest && !(vm.enabled && !vm.since)) {
          row.append(twice(some ? `Bring in the other ${count(rest, "memo")} too` : `Bring in all ${count(rest, "memo")}, older ones too`,
            `Add and transcribe ${some ? "the other" : "all"} ${rest}? Click again`, async () => {
            if (await act("/api/voicememos", { enabled: true, older: true }, problem)) { try { await post("/api/voicememos/sync", {}); watchJob(); } catch { /* the next sync does it */ } }
          }));
        }
        const here = vm.memos - rest;
        parts.push(el("p", { className: "note", textContent: `${count(vm.memos, "memo")} in the library${
          !vm.memos || !here ? "" : rest ? `, ${here} of them brought in` : vm.memos === 1 ? ", already brought in" : ", all brought in"}.` }), row);
      }
      parts.push(problem);
    }
    if (r.recordings.length) {
      const list = el("ul", { className: "added" });
      for (const rec of r.recordings) {
        const problem = el("small", { className: "when" });
        const when = el("input", { type: "datetime-local", step: 1, value: stamp(rec.start_ms), ariaLabel: "When it began" });
        const save = el("button", { className: "pill busy-off", textContent: "Save" });
        const editor = el("div", { className: "row when", hidden: true }, when, save);
        save.addEventListener("click", () => {
          const at = new Date(when.value).getTime();
          if (Number.isNaN(at)) { problem.textContent = "Choose a date and time."; return; }
          act("/api/recordings/move", { path: rec.path, start_ms: at }, problem);
        });
        const change = el("button", { className: "pill busy-off", textContent: "Change time" });
        change.addEventListener("click", () => { editor.hidden = !editor.hidden; if (!editor.hidden) when.focus(); });
        const open = el("a", { href: "#", textContent: `${shortDay.format(new Date(rec.start_ms))}, ${clock.format(new Date(rec.start_ms))}` });
        open.addEventListener("click", (e) => { e.preventDefault(); const d = new Date(rec.start_ms), p = (n) => String(n).padStart(2, "0"); openDay(`${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`); });
        list.append(el("li", {},
          el("b", { textContent: rec.name, title: rec.name }),
          el("small", {}, open, ` · ${long(rec.duration_ms)} · ${rec.transcribed ? count(rec.lines, "line") : "waiting to be transcribed"}${rec.source === "voicememos" ? " · Voice Memos" : ""}`),
          el("div", { className: "row acts" }, change, twice("Remove", "Remove for good? Click again", () => act("/api/recordings/remove", { path: rec.path }, problem))),
          editor, problem));
      }
      parts.push(el("h2", {}, ...withIcon("import", "Recordings you added", 22)),
        el("p", { textContent: "Removing one deletes its audio and its lines here. It does not touch the original file or your Voice Memos." }), list);
    }
    node.replaceChildren(...parts);
  }
  get("/api/recordings").then(draw).catch(() => {});
  return node;
}

/* A switch for starting at login and syncing without a terminal. Fills itself in once loaded. */
function autostartSwitch() {
  const box = el("input", { type: "checkbox", disabled: true });
  const about = el("small", { textContent: "Checking…" });
  const node = el("label", { className: "switch" }, box,
    el("span", {}, el("b", { textContent: "Start at login and keep the pendant synced" }), about));
  const show = (a) => {
    box.checked = a.enabled;
    box.disabled = !a.supported;
    about.classList.remove("failed");
    if (!a.supported) { about.textContent = "Only on macOS so far. Elsewhere, leave uv run limitful watch running in a terminal."; return; }
    const last = a.last ? ` Last tried ${clock.format(new Date(a.last))}: ${a.found ? "pendant found" : "pendant not in reach"}.` : "";
    about.textContent = a.enabled
      ? `Limitful starts when you log in and syncs the pendant every two minutes, with no terminal open. Synced audio is freed on the pendant.${a.syncing_every ? " It is syncing by itself now." : ""}${last}`
      : "Off. The pendant syncs only when you click Sync now or run uv run limitful watch.";
  };
  get("/api/autostart").then(show).catch(() => { about.textContent = "Could not check."; });
  box.addEventListener("change", async () => {
    box.disabled = true;
    try { show(await post("/api/autostart", { enabled: box.checked })); }
    catch (err) { box.checked = !box.checked; box.disabled = false; about.textContent = err.message; about.classList.add("failed"); }
  });
  return node;
}

/* The actions that fit a reminder's state, as a row of buttons. `after` runs once it is saved. */
function reminderActs(r, after, source) {
  const row = el("div", { className: "acts" });
  const act = (label, status) => {
    const b = el("button", { textContent: label, className: status === "dismissed" ? "away" : "" });
    b.addEventListener("click", async () => {
      try { await post(`/api/reminders/${r.id}`, { status }); r.status = status; after(); }
      catch (err) { row.append(el("small", { className: "failed", textContent: `Could not save. ${sentence(err.message)}` })); }
    });
    return b;
  };
  if (r.status === "suggested") row.append(act("Keep", "accepted"), act("Dismiss", "dismissed"));
  else if (r.status === "accepted") row.append(act("Done", "done"), act("Remove", "dismissed"));
  if (source) row.append(source);
  return row;
}

/* Reminders: suggestions to sort through on the left, your own list on the right. */
/* People: everyone who has been named, most recently heard first. Opening one lists the
   conversations they were heard in. */
async function showPeople() {
  leaveWelcome();
  document.title = "Lifelog, people";
  document.querySelector("header").classList.add("plain");
  searching = reminding = configuring = asking = false;
  peopling = true;
  for (const id of ["ask", "remind", "settings"]) $(id).setAttribute("aria-pressed", "false");
  $("who").setAttribute("aria-pressed", "true");
  visit("#people");
  $("title").textContent = "People";
  $("search").value = "";
  strip.replaceChildren();
  let all, guesses;
  try { [all, guesses] = await Promise.all([get("/api/persons"), get("/api/names/suggested").catch(() => [])]); }
  catch (err) {
    main.replaceChildren(el("p", { className: "empty", textContent: `Could not load people. ${sentence(err.message)}` }));
    return;
  }
  if (!peopling) return;  // moved on while it loaded
  const suggested = nameGuesses(guesses);
  if (!all.length) {
    main.replaceChildren(el("div", { className: "folk" }, ...suggested,
      el("p", { className: "empty", textContent: "No one has been named yet. Open a conversation and click a speaker's name to say who it is." })));
    return;
  }
  const most = Math.max(...all.map((p) => p.ms));
  const when = (ms) => {
    const key = dayKey(new Date(ms)), today = dayKey(new Date());
    return key === today ? "Today" : (key.slice(0, 4) === today.slice(0, 4) ? briefDay : briefDayYear).format(new Date(ms));
  };
  const rows = all.map((p) => {
    const heard = el("div", { className: "heard" });
    const box = el("details", {},
      el("summary", {},
        el("div", {}, el("b", { textContent: p.name }),
          el("small", { textContent: `${count(p.conversations, "conversation")} on ${count(p.days, "day")}, ${p.ms < 60000 ? "under a minute" : lengthOf(p.ms)} speaking${p.from_clues ? ". Named from what was said" : ""}` })),
        el("div", { className: "share", title: `${lengthOf(p.ms)} speaking` }, el("i", { style: `width: ${Math.max(2, 100 * p.ms / most)}%` })),
        el("time", { textContent: when(p.last), title: "Last heard" })),
      heard);
    box.addEventListener("toggle", async () => {
      if (!box.open || heard.childElementCount) return;
      let one;
      try { one = await get(`/api/persons/${p.id}`); }
      catch (err) { heard.replaceChildren(el("p", { className: "small", textContent: `Could not load. ${sentence(err.message)}` })); return; }
      const said = el("button", { className: "copy", textContent: `Search what ${p.name} said` });
      said.addEventListener("click", () => { const text = fromText(p.name); $("search").value = text; runSearch(text); });
      heard.replaceChildren(said, el("ul", {}, ...one.conversations.map((t) => {
        const go = el("button", { title: "Open this conversation" },
          el("time", { textContent: when(t.start) }), el("span", { textContent: t.title || "Untitled conversation" }),
          el("small", { textContent: t.ms < 60000 ? "under a minute" : lengthOf(t.ms) }));
        go.addEventListener("click", () => openDay(t.day, null, t.id));
        return el("li", {}, go);
      })));
    });
    return box;
  });
  const total = all.reduce((sum, p) => sum + p.ms, 0);
  main.replaceChildren(el("div", { className: "folk" }, ...suggested,
    el("p", { className: "lede", textContent: `${all.length === 1 ? "1 person" : `${all.length} people`} named, with ${lengthOf(total)} of speech between them.` }),
    el("p", { className: "small", textContent: "Most recently heard first. Only lines that carry a name are counted: a name given in one recording does not yet carry to that voice elsewhere, so the real figures are higher." }),
    ...rows));

/* Names that what was said points to ("I'm Joseph", "thanks, Joseph") but does not settle.
   One click accepts a name for that voice everywhere; "Not them" stops it being suggested. */
function nameGuesses(guesses) {
  if (!guesses || !guesses.length) return [];
  const rows = guesses.map((g) => {
    const row = el("li", {});
    const why = [count(g.conversations.length, "conversation"),
      g.introductions ? `${g.introductions} where they gave their name` : "",
      g.against ? `${count(g.against, "conversation")} pointing elsewhere` : ""].filter(Boolean).join(", ");
    const act = async (url, body) => {
      try { await post(url, body); await showPeople(); }
      catch (err) { row.append(el("small", { className: "oops", textContent: `Could not save. ${sentence(err.message)}` })); }
    };
    const yes = el("button", { className: "copy", textContent: `Yes, ${g.name}` });
    yes.addEventListener("click", () => act(`/api/speakers/${g.speaker}`, { name: g.name }));
    const no = el("button", { className: "copy", textContent: "Not them" });
    no.addEventListener("click", () => act(`/api/speakers/${g.speaker}/not`, { name: g.name }));
    const look = el("button", { className: "copy", textContent: "Listen", title: g.example.title || "Open a conversation with this voice" });
    const d = new Date(g.example.start);
    look.addEventListener("click", () => openDay(dayKey(d), null, g.example.id));
    row.append(el("span", { textContent: `${g.label} might be ${g.name}` },
      el("small", { textContent: `${why}. ${count(g.lines, "line")} in this voice.` })), yes, no, look);
    return row;
  });
  return [el("section", { className: "guesses" },
    el("h3", { textContent: "Who might these voices be?" }),
    el("p", { textContent: `Names picked up from what was said. A name is given automatically once three conversations agree and none disagree; these are short of that.` }),
    el("ul", {}, ...rows))];
}
